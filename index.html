<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>나선 시네마</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
  // 모듈 코드가 못 뜨는 환경(미리보기 제한 등)이면 입장권에 이유를 보여 줌
  window.__bootFail = function (msg) {
    var m = document.getElementById('bootMsg'), b = document.getElementById('enterBtn');
    if (m) { m.hidden = false; m.textContent = msg; }
    if (b) { b.disabled = true; b.textContent = '입장할 수 없어요'; }
  };
  setTimeout(function () {
    if (!window.__cinemaReady) window.__bootFail('화면을 준비하지 못했어요. 미리보기 창에서는 막힐 수 있으니, 파일을 받아 크롬이나 사파리로 직접 열어 주세요.');
  }, 15000);
</script>
<style>
:root{
  --ink:#0E1430; --ink-a:rgba(14,20,48,.80); --ink-2:#1B2350;
  --star:#F3EEDC; --dim:#9298B3; --line:rgba(243,238,220,.10);
  --usher:#F2A541; --usher-ink:#231503; --oxblood:#7A2232; --exit:#3FD08A; --danger:#FF7A6B;
  --paper:#EFE6CC; --paper-ink:#1D1A33;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --ui:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --marquee:"Black Han Sans","Pretendard Variable",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--star);font-family:var(--ui);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--usher);outline-offset:2px}
[hidden]{display:none!important}

#css3d{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#css3d iframe{border:0;pointer-events:none}
#gl{position:fixed;inset:0;z-index:1;width:100%;height:100%;display:block;touch-action:none;outline:none}
#crosshair{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:rgba(243,238,220,.85);box-shadow:0 0 0 1.5px rgba(0,0,0,.55);z-index:4;pointer-events:none;display:none}
body.playing #crosshair{display:block}
body.big #crosshair,body.modal-open #crosshair{display:none}

#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#hud #prompt,#hud #hints,#hud #hand{pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;
  background:var(--ink-a);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:13px;font-weight:600;white-space:nowrap}
.chip.icon{width:36px;padding:0;justify-content:center}
.chip b{font-weight:700;color:var(--usher)}
.chip:hover{border-color:rgba(242,165,65,.45)}
.panel{background:var(--ink-a);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.primary{background:var(--usher);color:var(--usher-ink);font-weight:700;border-radius:10px;padding:0 14px;height:34px}
.primary:hover{filter:brightness(1.08)}
.ghost{border:1px solid var(--line);border-radius:10px;padding:0 12px;height:32px;font-size:13px;font-weight:600;background:rgba(255,255,255,.03)}
.ghost:hover{border-color:rgba(242,165,65,.5)}
.ghost.danger{color:var(--danger);border-color:rgba(255,122,107,.35)}
.wide{width:100%}
kbd{display:inline-block;min-width:20px;padding:1px 6px;border-radius:5px;border:1px solid rgba(243,238,220,.25);
  border-bottom-width:2px;font:600 11px/16px var(--ui);text-align:center;color:var(--star)}

/* top-left */
#tl{position:absolute;top:calc(12px + var(--safe-t));left:calc(12px + var(--safe-l));display:flex;gap:8px;align-items:flex-start}
#usersPanel{position:absolute;top:44px;left:0;width:280px;max-height:60vh;overflow:auto;padding:8px;z-index:4}
.urow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;font-size:13px}
.urow:hover{background:rgba(255,255,255,.04)}
.urow i{width:10px;height:10px;border-radius:50%;flex:none}
.urow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow .nm small{color:var(--dim);font-weight:500}
.urow .where{color:var(--dim);font-size:11.5px}
.urow.away .nm{opacity:.55}
.utitle{font-size:12px;color:var(--dim);padding:4px 8px 6px}

/* now playing ticket */
#ticket{position:absolute;top:calc(12px + var(--safe-t));left:50%;transform:translateX(-50%);width:min(440px,40vw);
  display:flex;flex-direction:column;gap:8px;z-index:3} /* 상영·투표 카드가 채팅 기록보다 위 (가로 폰에서 겹쳐도 투표 버튼이 눌리게) */
.stub{position:relative;padding:9px 22px 10px;background:var(--ink-a);border-radius:10px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  -webkit-mask:radial-gradient(circle 7px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 7px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
#nowLine{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:700}
#nowTitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowMeta{font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowBar{height:3px;border-radius:2px;background:rgba(243,238,220,.12);margin-top:7px;overflow:hidden}
#nowBar i{display:block;height:100%;width:0;background:var(--usher)}
#voteCard{padding:10px 14px;font-size:13px}
#voteCard .vt{font-weight:700;display:flex;justify-content:space-between;gap:8px}
#voteCard .vt span{color:var(--dim);font-weight:600}
#voteCard .vs{color:var(--dim);margin:4px 0 8px;font-size:12px;line-height:1.4}
#voteCard .vrow{display:flex;gap:8px}
#voteCard .vrow button{flex:1}
#voteCard .vrow button.on{background:var(--usher);color:var(--usher-ink);border-color:transparent}
#voteCard .meter{height:6px;border-radius:3px;background:rgba(243,238,220,.12);margin:8px 0 2px;display:flex;overflow:hidden}
#voteCard .meter b{background:var(--usher)} #voteCard .meter u{background:#6E7BD9}

/* top-right */
#tr{position:absolute;top:calc(12px + var(--safe-t));right:calc(12px + var(--safe-r));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#urlForm{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 12px;border-radius:12px;background:var(--ink-a);
  border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#urlInput{width:230px;background:none;border:0;outline:none;font-size:13px;height:32px}
#urlInput::placeholder{color:var(--dim)}
#prioWrap{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--usher);padding:0 4px;cursor:pointer;white-space:nowrap}
#prioWrap em{font-style:normal;color:var(--dim)}
#prioWrap input{accent-color:var(--usher);margin:0}
#trBtns{display:flex;gap:8px}

/* queue panel */
#queuePanel{position:absolute;z-index:4;top:calc(104px + var(--safe-t));right:calc(12px + var(--safe-r));width:340px;max-height:calc(100% - 250px);overflow:auto;padding:14px}
#queuePanel h3{margin:0 0 8px;font-size:13px;color:var(--dim);font-weight:600}
.qnow{padding:10px 12px;border-radius:10px;background:rgba(242,165,65,.10);border:1px solid rgba(242,165,65,.25);margin-bottom:12px}
.qnow .t{font-weight:700;font-size:14px;line-height:1.35}
.qnow .m{font-size:12px;color:var(--dim);margin-top:3px}
.qnow .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.qitem{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:8px 4px;border-top:1px solid var(--line)}
.qitem .n{font-size:12px;color:var(--dim);font-weight:700;padding-top:2px;text-align:right}
.qitem .t{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qitem .m{font-size:11.5px;color:var(--dim);margin-top:2px}
.qitem .m .star{color:var(--usher)}
.qitem .b{display:flex;gap:4px}
.qitem .b button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);font-size:13px}
.qitem .b button:hover{border-color:var(--usher)}
.qempty{font-size:13px;color:var(--dim);padding:10px 4px;line-height:1.5}
.qtools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.qtools .lbl{width:100%;font-size:12px;color:var(--dim)}

/* chat */
#chat{position:absolute;left:calc(12px + var(--safe-l));bottom:calc(12px + var(--safe-b));width:360px;display:flex;flex-direction:column;gap:6px}
#chatFilters{display:flex;gap:2px;align-self:flex-start;padding:3px;border-radius:9px;background:var(--ink-a);border:1px solid var(--line)}
#chatFilters button{font-size:12px;font-weight:600;padding:4px 10px;border-radius:7px;color:var(--dim)}
#chatFilters button.on{background:rgba(243,238,220,.12);color:var(--star)}
#chatLog{height:210px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:4px 2px;
  -webkit-mask:linear-gradient(transparent,#000 22%);mask:linear-gradient(transparent,#000 22%);scrollbar-width:thin}
.msg{font-size:13px;line-height:1.45;padding:1px 8px;text-shadow:0 1px 3px rgba(0,0,0,.9);word-break:break-word}
.msg b{font-weight:700}
.msg.sys{color:var(--exit)}
.msg.sys.warn{color:var(--usher)}
.msg time{font-size:10.5px;color:var(--dim);margin-right:5px}
#chatForm input{width:100%;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink-a);outline:none;font-size:13.5px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#chatForm input:focus{border-color:rgba(242,165,65,.6)}
#chatForm input::placeholder{color:var(--dim)}

#prompt{position:absolute;left:50%;bottom:calc(112px + var(--safe-b));transform:translateX(-50%);padding:8px 14px;border-radius:999px;
  background:var(--ink-a);border:1px solid rgba(242,165,65,.35);font-size:14px;font-weight:600;white-space:nowrap}
#hints{position:absolute;left:calc(392px + var(--safe-l));right:calc(190px + var(--safe-r));bottom:calc(14px + var(--safe-b));display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:12px;color:var(--dim);
  white-space:nowrap;text-shadow:0 1px 2px #000}
#hints span{display:inline-flex;gap:5px;align-items:center}

#hand{position:absolute;right:calc(108px + var(--safe-r));bottom:calc(4px + var(--safe-b));font-size:46px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));transform-origin:50% 90%}
#hand.eat{animation:munch .55s ease-in-out infinite}
@keyframes munch{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(8deg)}}

/* bag */
#bag{position:absolute;right:calc(12px + var(--safe-r));bottom:calc(12px + var(--safe-b));display:flex;align-items:flex-end;gap:8px;flex-direction:column}
#bagSlots{display:flex;gap:6px;padding:6px;border-radius:14px;background:var(--ink-a);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex-wrap:wrap;max-width:min(470px,70vw);justify-content:flex-end}
.slot{position:relative;width:50px;height:50px;border-radius:10px;border:1px solid var(--line);font-size:26px;display:grid;place-items:center;background:rgba(255,255,255,.03)}
.slot:hover,.slot.sel{border-color:var(--usher)}
.slot sub{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:700;color:var(--star)}
.slot.worn::after{content:"착용";position:absolute;left:3px;top:2px;font-size:9px;font-weight:700;color:var(--exit)}
.slot.held::after{content:"손";position:absolute;left:3px;top:2px;font-size:9px;font-weight:700;color:var(--usher)}
.slotmenu{position:absolute;bottom:calc(100% + 8px);right:0;min-width:168px;padding:6px;display:flex;flex-direction:column;gap:2px;z-index:3}
.slotmenu .h{font-size:12px;color:var(--dim);padding:4px 8px}
.slotmenu button{text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600}
.slotmenu button:hover{background:rgba(255,255,255,.06)}

/* mobile controls */
#mobile{display:none}
#soundBtn,#exitBig{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(160px + var(--safe-b));height:40px;padding:0 16px;border-radius:999px;
  background:var(--usher);color:var(--usher-ink);font-weight:700;font-size:14px}
#exitBig{bottom:auto;top:calc(12px + var(--safe-t));background:var(--ink-a);color:var(--star);border:1px solid var(--line)}
body.big #ticket,body.big #tr,body.big #tl,body.big #queuePanel,body.big #hints,body.big #prompt,body.big #bag,body.big #mobile,body.big #hand{display:none!important}
body.big #chat{opacity:.85}

/* modal */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(3,4,12,.55);padding:16px}
#modal .sheet{width:min(560px,100%);max-height:min(86vh,760px);overflow:auto;padding:20px 20px 22px;background:rgba(14,20,48,.94);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet h2{margin:0;font:400 26px/1.15 var(--marquee);letter-spacing:.01em}
.sheet .lead{margin:6px 0 16px;color:var(--dim);font-size:13.5px;line-height:1.5}
.sheet .x{float:right;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);font-size:16px}
.menu-sec{margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--usher)}
.mrow{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px dashed rgba(243,238,220,.10)}
.mrow .e{font-size:24px;text-align:center}
.mrow .nm{font-size:14px;font-weight:600}
.mrow .nm small{display:block;font-size:11.5px;color:var(--dim);font-weight:500;margin-top:1px}
.mrow .pr{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.mrow button{height:30px;padding:0 12px;border-radius:8px;background:rgba(242,165,65,.14);color:var(--usher);font-weight:700;font-size:13px}
.mrow button:hover{background:var(--usher);color:var(--usher-ink)}
.free-note{font-size:12px;color:var(--exit);margin-top:12px}
.post{padding:12px 0;border-bottom:1px solid var(--line)}
.post .who{font-size:12px;color:var(--dim)} .post .who b{color:var(--star)}
.post .txt{font-size:14px;line-height:1.5;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.post .reply{margin-top:8px;padding:8px 10px;border-left:3px solid var(--exit);background:rgba(63,208,138,.07);border-radius:0 8px 8px 0;font-size:13px;line-height:1.5}
.post .reply b{color:var(--exit)}
.post .pa{display:flex;gap:6px;margin-top:8px}
.post .pa input{flex:1;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);outline:none;font-size:13px}
textarea.in,input.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);outline:none;font:14px/1.5 var(--ui);color:var(--star);resize:vertical}
textarea.in:focus,input.in:focus{border-color:rgba(242,165,65,.6)}
.formrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.formrow .cnt{flex:1;font-size:12px;color:var(--dim)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.setrow small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.setrow input[type=range]{width:150px;accent-color:var(--usher)}
.toggle{width:46px;height:26px;border-radius:999px;background:rgba(243,238,220,.18);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--star);transition:transform .15s}
.toggle.on{background:var(--usher)} .toggle.on::after{transform:translateX(20px);background:var(--usher-ink)}
.confirm-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.confirm-actions .primary{height:38px;padding:0 18px}
.confirm-actions .ghost{height:38px}

/* piano */
.piano{position:relative;height:170px;margin-top:6px;user-select:none;-webkit-user-select:none;touch-action:none}
.piano .w{position:absolute;top:0;bottom:0;border:1px solid #2a2a2a;border-radius:0 0 8px 8px;background:linear-gradient(#fbf8ef,#e8e1cc);color:#5b5640;
  font-size:11px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.piano .b{position:absolute;top:0;height:60%;border-radius:0 0 6px 6px;background:linear-gradient(#2a2a32,#08080c);color:#aaa;z-index:2;font-size:10px;font-weight:700;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-shadow:0 3px 0 #000}
.piano .on{filter:brightness(.82);background:linear-gradient(#ffd38a,#f2a541)!important;color:#3b2405}

/* toasts */
#toasts{position:fixed;top:calc(118px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:25;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:9px 16px;border-radius:999px;background:rgba(14,20,48,.92);border:1px solid var(--line);font-size:13.5px;font-weight:600;animation:tin .18s ease-out}
.toast.err{border-color:rgba(255,122,107,.5);color:#ffd2cc}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* entry ticket */
#entry{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;
  background:radial-gradient(ellipse at 50% 40%,rgba(5,6,16,.15),rgba(2,2,8,.72))}
.admit{width:min(580px,100%);display:grid;grid-template-columns:1fr 128px;background:var(--paper);color:var(--paper-ink);border-radius:14px;
  box-shadow:0 40px 90px rgba(0,0,0,.6);transform:rotate(-1.2deg);animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  -webkit-mask:radial-gradient(circle 13px at calc(100% - 128px) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 13px at calc(100% - 128px) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle 13px at calc(100% - 128px) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 13px at calc(100% - 128px) 100%,#0000 97%,#000) bottom/100% 51% no-repeat}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotate(2deg)}}
.admit .body{padding:28px 30px 26px}
.admit h1{margin:0;font:400 54px/1 var(--marquee);color:var(--oxblood);letter-spacing:-.01em}
.admit .sub{margin:10px 0 22px;font-size:14px;font-weight:600;color:#4c4766}
.admit .field{display:block;font-size:12.5px;font-weight:700;color:#4c4766;margin-bottom:18px}
.admit input{display:block;width:100%;margin-top:4px;border:0;border-bottom:2px solid var(--paper-ink);background:transparent;outline:none;
  font:700 22px/1.3 var(--ui);color:var(--paper-ink);padding:4px 0}
.admit input::placeholder{color:rgba(29,26,51,.3)}
#swatches{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
#swatches button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
#swatches button.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--paper-ink)}
.admit .primary{background:var(--oxblood);color:var(--paper);height:48px;font-size:16px;border-radius:10px;margin-top:4px}
#fileWarn{margin:14px 0 0;font-size:12.5px;line-height:1.5;color:#9a3412;font-weight:600}

body.touch #mobile{display:block}

<script type="module">
// ============================================================
//  나선 시네마 — 같이 보는 유튜브 영화관 (IMAX관 하나)
//
//  여는 법: GitHub Pages처럼 https 주소에 올려서 여세요. (파일을 바로 열면 유튜브가 막혀요)
//  같이 보기: 이 주소로 들어온 사람의 기기가 방이 되고(서버 역할), 🔗 초대 버튼의 링크(?room=코드)로
//    다른 폰·PC가 들어와요. 방장이 이 페이지를 켜 둔 동안에만 방이 열려 있어요.
//    기기끼리는 WebRTC로 직접 연결되고, 처음 서로를 찾을 때만 PeerJS 무료 중계 서버를 거쳐요.
//  설정: 아래 CONFIG (운영진 비밀번호, 부재중 시간, 우선 예약 횟수 등)
// ============================================================

// three.js는 CDN 여러 곳 중 열리는 곳에서 받아 옴 (한 곳이 막혀도 들어갈 수 있게)
const THREE_URLS = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',
];
let THREE = null;
for (const url of THREE_URLS) {
  try { THREE = await import(url); break; } catch (e) { console.warn('three.js 불러오기 실패:', url, e); }
}
if (!THREE) {
  window.__bootFail?.('3D 엔진을 내려받지 못했어요. 인터넷 연결을 확인하거나, 파일을 받아 크롬·사파리로 직접 열어 주세요.');
  throw new Error('three.js를 불러오지 못함');
}

// ---------- 유튜브 화면을 3D 공간에 붙이는 CSS3D 렌더러 (three.js 예제 코드를 줄여서 넣음, MIT) ----------
class CSS3DObject extends THREE.Object3D {
  constructor(element) {
    super(); this.isCSS3DObject = true; this.element = element;
    element.style.position = 'absolute'; element.style.pointerEvents = 'none'; element.style.userSelect = 'none';
  }
}
class CSS3DRenderer {
  constructor() {
    const dom = this.domElement = document.createElement('div'); dom.style.overflow = 'hidden';
    const view = document.createElement('div'); view.style.transformOrigin = '0 0'; view.style.pointerEvents = 'none'; dom.appendChild(view);
    const camEl = document.createElement('div'); camEl.style.transformStyle = 'preserve-3d'; view.appendChild(camEl);
    let wh = 0, hh = 0, camStyle = '';
    const eps = v => Math.abs(v) < 1e-10 ? 0 : v;
    const camM = m => { const e = m.elements; return `matrix3d(${eps(e[0])},${eps(-e[1])},${eps(e[2])},${eps(e[3])},${eps(e[4])},${eps(-e[5])},${eps(e[6])},${eps(e[7])},${eps(e[8])},${eps(-e[9])},${eps(e[10])},${eps(e[11])},${eps(e[12])},${eps(-e[13])},${eps(e[14])},${eps(e[15])})`; };
    const objM = m => { const e = m.elements; return `translate(-50%,-50%)matrix3d(${eps(e[0])},${eps(e[1])},${eps(e[2])},${eps(e[3])},${eps(-e[4])},${eps(-e[5])},${eps(-e[6])},${eps(-e[7])},${eps(e[8])},${eps(e[9])},${eps(e[10])},${eps(e[11])},${eps(e[12])},${eps(e[13])},${eps(e[14])},${eps(e[15])})`; };
    this.setSize = (w, h) => {
      wh = w / 2; hh = h / 2;
      for (const el of [dom, view, camEl]) { el.style.width = w + 'px'; el.style.height = h + 'px'; }
    };
    this.render = (scene, camera) => {
      const fov = camera.projectionMatrix.elements[5] * hh;
      scene.updateMatrixWorld(); if (camera.parent === null) camera.updateMatrixWorld();
      const style = `perspective(${fov}px) translateZ(${fov}px)${camM(camera.matrixWorldInverse)}translate(${wh}px,${hh}px)`;
      if (style !== camStyle) { camEl.style.transform = style; camStyle = style; }
      scene.traverse(o => {
        if (!o.isCSS3DObject) return;
        o.element.style.display = o.visible ? '' : 'none';
        if (!o.visible) return;
        const s = objM(o.matrixWorld);
        if (o._css !== s) { o.element.style.transform = s; o._css = s; }
        if (o.element.parentNode !== camEl) camEl.appendChild(o.element);
      });
    };
  }
}

/*@shared-start*/
// ============================================================
//  나선 시네마 — 설정 (여기 값만 바꿔도 동작이 달라져요)
// ============================================================
const CONFIG = {
  ROOM_NAME: '나선 시네마',          // 이름 — 입장권, 창 제목, 스크린, 포스터에 쓰여요
  ADMIN_PASSWORD: '',               // 비워 두면: 방을 연 사람만 운영진. 다른 사람용 비밀번호는 방장이 설정 화면에서 정함
                                    // (이 파일은 누구나 열어 볼 수 있으니 여기에 비밀번호를 적지 않는 게 안전해요)
  AWAY_MS: 10 * 60 * 1000,          // 이만큼 아무것도 안 하면 (부재중)
  HOST_PRIORITY_LIMIT: 5,           // 방장 우선 예약 횟수 (세션당)
  MAX_QUEUE_PER_USER: 5,            // 한 사람이 걸어둘 수 있는 예약 수
  VOTE_MS: 30 * 1000,               // 넘기기·싸움 투표 시간
  BAG_SLOTS: 8,                     // 가방 칸 수
  STACK_MAX: 3,                     // 한 칸에 쌓을 수 있는 개수
  TRAY_MAX: 3,                      // 좌석 트레이에 올려둘 수 있는 먹거리 수
  BOTS_DEFAULT: false,              // 테스트용 관객 봇 (방장이 설정에서 켤 수 있음)
  SPARRING_BOT: true,               // 로비 스파링봇 (방장이 설정에서 끌 수 있음)
  BOT_COUNT: 4,
  PVP_DEFAULT: true,                // 주먹다짐 허용 (방장이 설정에서 끄고 켤 수 있음)
  HP_MAX: 100,
  RESPAWN_MS: 3500,                 // 쓰러진 뒤 로비에서 다시 일어나기까지
  SCREEN_GAP: 13,                   // 맨 앞줄 눈높이에서 스크린까지 거리(m). null이면 맨 앞줄이 31°로 올려다보게 자동 계산
  CHANNEL: 'starlight-cinema-v1',   // 같은 브라우저 탭끼리 연결되는 채널 이름
  PEER_OPTIONS: {},                 // 기기 간 연결(PeerJS) 설정. 비워 두면 PeerJS 무료 중계 서버를 씀
};

// ---------- 상품 카탈로그 ----------
// kind: food/drink(먹으면 사라짐) · wear(착용) · hold(손에 들기) · collect(소장)

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function parseYouTubeId(input) {
  const s = String(input || '').trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  let u; try { u = new URL(s.startsWith('http') ? s : 'https://' + s); } catch { return null; }
  const h = u.hostname.replace(/^www\.|^m\.|^music\./, '');
  let id = null;
  if (h === 'youtu.be') id = u.pathname.slice(1, 12);
  else if (h.endsWith('youtube.com') || h.endsWith('youtube-nocookie.com')) {
    id = u.searchParams.get('v');
    const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([A-Za-z0-9_-]{11})/);
    if (!id && m) id = m[1];
  }
  return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
}
function startAtFromUrl(input) {
  try { const u = new URL(String(input).trim()); const t = u.searchParams.get('t') || u.searchParams.get('start'); if (!t) return 0;
    const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/); if (!m) return 0;
    return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0); } catch { return 0; }
}

// ============================================================
//  공간 배치 — 서버(좌석·봇)와 화면(3D) 양쪽이 같이 씀
// ============================================================
const L = (() => {
  const ROWS = 5, PER_ROW = 14, RD = 1.4, RISE = 0.6, PITCH = 1.0, LEG = 0.6;
  const Z0 = 0;                          // A열 단이 시작되는 z
  const TOP_Y = ROWS * RISE;             // 맨 뒤 통로·복도·로비 바닥 높이
  const BACK_Z = Z0 + ROWS * RD + 2.2;   // 상영관 뒷벽
  const SCR_H = 12, SCR_W = +(SCR_H * 1.43).toFixed(3), SCR_BOTTOM = 0.9;
  const SCR_TOP = SCR_BOTTOM + SCR_H;
  const EYE_SEATED = 1.12, EYE_STAND = 1.62;
  const FRONT_EYE_Z = Z0 + 1.15, FRONT_EYE_Y = EYE_SEATED;
  const TARGET_ANGLE = 31;               // 맨 앞줄에서 스크린 윗변을 올려다보는 각도(도)
  // 맨 앞줄 눈높이에서 스크린 윗변이 정확히 31°가 되도록 스크린을 뒤로 민다
  const SCREEN_Z = +(FRONT_EYE_Z - (Number.isFinite(CONFIG.SCREEN_GAP) && CONFIG.SCREEN_GAP > 3 ? CONFIG.SCREEN_GAP
    : (SCR_TOP - FRONT_EYE_Y) / Math.tan(TARGET_ANGLE * Math.PI / 180))).toFixed(3);
  const HALL_X = 10.5, CEIL_Y = 15;
  const LOBBY_Z0 = BACK_Z + 6, LOBBY_Z1 = LOBBY_Z0 + 14.2, LOBBY_X = 11, LOBBY_H = 5;
  const DOOR_W = 2.4, DOOR_H = 2.5, CORR_H = 3.1;

  const rowLetter = i => 'ABCDEFGHIJKLMNOP'[i];
  const seats = [];
  for (let r = 0; r < ROWS; r++) {
    const start = Z0 + r * RD, y = r * RISE;
    for (let c = 0; c < PER_ROW; c++) {
      const x = -((PER_ROW - 1) / 2) * PITCH + c * PITCH;
      seats.push({ id: rowLetter(r) + (c + 1), row: r, col: c, x, y, z: start + 0.95,
        eye: { x, y: y + EYE_SEATED, z: start + 1.15 }, stand: { x, z: start + LEG * 0.5 } });
    }
  }
  const seatById = Object.fromEntries(seats.map(s => [s.id, s]));

  function floorAt(x, z) {
    if (z < Z0) return 0;
    if (z < BACK_Z) return Math.min(ROWS, Math.floor((z - Z0) / RD)) * RISE;
    return TOP_Y;
  }
  function zoneAt(x, z) { return z < BACK_Z ? 'theater' : z < LOBBY_Z0 ? 'corridor' : 'lobby'; }

  const walk = [
    [-HALL_X + 0.25, HALL_X - 0.25, SCREEN_Z + 1.2, BACK_Z],            // 상영관
    [-DOOR_W / 2, DOOR_W / 2, BACK_Z - 1, BACK_Z + 1],                   // 출입문
    [-DOOR_W / 2, DOOR_W / 2, BACK_Z, LOBBY_Z0 + 1],                     // 진입 통로
    [-LOBBY_X + 0.2, LOBBY_X - 0.2, LOBBY_Z0, LOBBY_Z1 - 0.2],          // 로비
  ];
  // 로비 안 시설 위치
  const P = {
    counter:  { x0: -5, x1: 3, z0: LOBBY_Z1 - 2.4, z1: LOBBY_Z1 - 1.3 },
    goods:    { x0: LOBBY_X - 1.6, x1: LOBBY_X, z0: LOBBY_Z0 + 3.2, z1: LOBBY_Z0 + 10.2 },
    vending:  { x0: 2.3, x1: 3.5, z0: LOBBY_Z0, z1: LOBBY_Z0 + 0.95 },
    piano:    { x0: -LOBBY_X, x1: -LOBBY_X + 1.7, z0: LOBBY_Z0 + 7.2, z1: LOBBY_Z0 + 9.0 },
    board:    { x: -LOBBY_X, z: LOBBY_Z0 + 3.4, w: 3.0 },
    benchL:   { x0: -6.2, x1: -3.2, z0: LOBBY_Z0 + 5.2, z1: LOBBY_Z0 + 6.0 },
    benchR:   { x0: 3.2, x1: 6.2, z0: LOBBY_Z0 + 5.2, z1: LOBBY_Z0 + 6.0 },
  };
  const colliders = [];
  for (let r = 0; r < ROWS; r++) colliders.push([-(PER_ROW / 2) * PITCH - 0.05, (PER_ROW / 2) * PITCH + 0.05, Z0 + r * RD + LEG, Z0 + (r + 1) * RD]);
  for (const k of ['counter', 'goods', 'vending', 'piano', 'benchL', 'benchR']) { const b = P[k]; colliders.push([b.x0, b.x1, b.z0, b.z1]); }

  const spots = {
    snack:   { x: -1, z: P.counter.z0 - 1.0, r: 2.6, label: '매점 메뉴 보기' },
    goods:   { x: P.goods.x0 - 1.0, z: (P.goods.z0 + P.goods.z1) / 2, r: 2.6, label: '굿즈샵 둘러보기' },
    vending: { x: (P.vending.x0 + P.vending.x1) / 2, z: P.vending.z1 + 0.9, r: 1.5, label: '자판기 음료 뽑기' },
    piano:   { x: P.piano.x1 + 0.8, z: (P.piano.z0 + P.piano.z1) / 2, r: 1.7, label: '피아노 치기' },
    board:   { x: -LOBBY_X + 1.1, z: P.board.z, r: 2.0, label: '건의사항 게시판 보기' },
  };
  const SPAWN = { x: 0, z: LOBBY_Z0 + 4.2, yaw: 0 };

  function walkable(x, z, rad = 0.28) {
    let inside = false;
    for (const [a, b, c, d] of walk) if (x >= a + rad && x <= b - rad && z >= c + rad && z <= d - rad) { inside = true; break; }
    if (!inside) return false;
    for (const [a, b, c, d] of colliders) if (x > a - rad && x < b + rad && z > c - rad && z < d + rad) return false;
    return true;
  }
  return { ROWS, PER_ROW, RD, RISE, PITCH, LEG, Z0, TOP_Y, BACK_Z, SCR_H, SCR_W, SCR_BOTTOM, SCR_TOP, SCREEN_Z, EYE_SEATED, EYE_STAND,
    FRONT_EYE_Z, FRONT_EYE_Y, TARGET_ANGLE, HALL_X, CEIL_Y, LOBBY_Z0, LOBBY_Z1, LOBBY_X, LOBBY_H, DOOR_W, DOOR_H, CORR_H,
    seats, seatById, floorAt, zoneAt, walkable, P, spots, SPAWN, rowLetter };
})();

const BOARD_KEY = 'starlight:board';

class CinemaServer {
  constructor(send, restore) {
    this.send = send;
    this.users = new Map();
    this.bags = {}; this.prioUsed = {}; this.trays = {};
    this.queue = []; this.now = null; this.vote = null; this.chatLog = [];
    this.hostId = null; this.botsOn = CONFIG.BOTS_DEFAULT; this.pvp = CONFIG.PVP_DEFAULT; this.rl = new Map(); this.seq = 1;
    this._dirty = null; this._posVer = 0; this._posSent = -1; this._posAt = 0;
    if (restore) {
      this.queue = restore.queue || []; this.now = restore.now || null; this.bags = restore.bags || {};
      this.prioUsed = restore.prioUsed || {}; this.chatLog = restore.chatLog || []; this.botsOn = restore.botsOn ?? this.botsOn; this.pvp = restore.pvp ?? this.pvp;
      this.seq = restore.seq || 1;
    }
    this.board = restore?.board || this.loadBoard();
    this.sparOn = restore?.sparOn ?? CONFIG.SPARRING_BOT;
    this.ownerId = null; // 방을 연 사람(서버 역할 탭의 주인) — 자동으로 운영진·방장
    try { this.adminPw = localStorage.getItem('starlight:adminpw') || ''; } catch { this.adminPw = ''; }
    // 숨은 방장 열쇠: 채팅창에 "/방장 열쇠"를 치면 그 사람이 방장이 되고, 그 기기는 다음부터 들어오면 자동으로 방장
    // (Render 서버는 OWNER_KEY 환경 변수. 없으면 운영진 비밀번호로 대신함)
    try { this.ownerKey = localStorage.getItem('starlight:ownerkey') || ''; } catch { this.ownerKey = ''; }
    if (this.botsOn) this.spawnBots();
    if (this.sparOn) this.spawnSparring();
    this.timers = [setInterval(() => this.tick(), 500), setInterval(() => this.broadcastPositions(), 100)];
  }
  stop() { this.timers.forEach(clearInterval); }
  snapshot() {
    return { queue: this.queue, now: this.now, bags: this.bags, prioUsed: this.prioUsed, board: this.board,
      chatLog: this.chatLog.slice(-40), botsOn: this.botsOn, sparOn: this.sparOn, pvp: this.pvp, seq: this.seq };
  }
  loadBoard() { try { return JSON.parse(localStorage.getItem(BOARD_KEY)) || []; } catch { return []; } }
  saveBoard() { try { localStorage.setItem(BOARD_KEY, JSON.stringify(this.board.slice(-100))); } catch {} }

  // ---------- 도우미 ----------
  nid() { return 'q' + (this.seq++).toString(36); }
  pwOk(pw) { pw = String(pw ?? ''); return !!pw && ((this.adminPw && pw === this.adminPw) || (CONFIG.ADMIN_PASSWORD && pw === CONFIG.ADMIN_PASSWORD)); }
  ownerOk(k) { k = String(k ?? '').trim(); return !!k && !!(this.ownerKey ? k === this.ownerKey : this.pwOk(k)); }
  rate(id, key, ms) { const k = id + ':' + key, t = Date.now(), last = this.rl.get(k) || 0; if (t - last < ms) return false; this.rl.set(k, t); return true; }
  isAway(u) { return Date.now() - u.lastActive > CONFIG.AWAY_MS; }
  // 투표할 수 있는 사람: 부재중이 아닌 사람 (투표를 안 하는 스파링봇은 빼고 셈)
  eligible() { return [...this.users.values()].filter(u => !this.isAway(u) && u.id !== SPARRING.id); }
  toast(id, text, err = false) { this.send(id, { t: 'toast', text, err }); }
  sys(text, warn = false) {
    const m = { t: 'chat', kind: 'sys', text, warn, at: Date.now() };
    this.chatLog.push(m); if (this.chatLog.length > 80) this.chatLog.shift();
    this.send('*', m);
  }
  label(item) { return item.title || `youtu.be/${item.videoId}`; }
  // 같은 처리 안에서 바뀐 것들을 한 번에 묶어서 보냄 (백그라운드 탭에서도 타이머 지연 없이)
  dirty() { if (this._dirty) return; this._dirty = true; queueMicrotask(() => { this._dirty = null; this.send('*', this.roomState()); }); }
  bagOf(u) { return (this.bags[u.sessionId] ||= {}); }
  canAdd(bag, keys) {
    const b = { ...bag };
    for (const k of keys) b[k] = (b[k] || 0) + 1;
    const max = k => (['wear', 'hold', 'collect'].includes(ITEMS[k].kind) ? 1 : CONFIG.STACK_MAX);
    for (const k of keys) if (b[k] > max(k)) return ITEMS[k].kind === 'food' || ITEMS[k].kind === 'drink'
      ? `${ITEMS[k].name}은(는) ${CONFIG.STACK_MAX}개까지만 들 수 있어요` : `${ITEMS[k].name}은(는) 이미 갖고 있어요`;
    if (Object.keys(b).filter(k => b[k] > 0).length > CONFIG.BAG_SLOTS) return `가방이 가득 찼어요 (${CONFIG.BAG_SLOTS}칸)`;
    return null;
  }
  addItems(u, keys) { const bag = this.bagOf(u); for (const k of keys) bag[k] = (bag[k] || 0) + 1; }
  takeItem(u, key) {
    const bag = this.bagOf(u); if (!(bag[key] > 0)) return false;
    if (--bag[key] <= 0) { delete bag[key]; if (u.hold === key) u.hold = null; for (const s in u.wear) if (u.wear[s] === key) u.wear[s] = null; }
    return true;
  }
  sendBag(u) { if (!u.isBot) this.send(u.id, { t: 'bag', bag: this.bagOf(u), prioUsed: this.prioUsed[u.sessionId] || 0 }); }

  pub(u) {
    return { id: u.id, name: u.name, color: u.color, isBot: !!u.isBot, admin: !!u.admin, away: this.isAway(u),
      seat: u.seat, zone: u.zone, hold: u.hold, wear: u.wear, eating: u.eating, joinedAt: u.joinedAt, lastActive: u.lastActive,
      hp: u.hp ?? CONFIG.HP_MAX, dead: !!u.dead, kills: u.kills || 0, deaths: u.deaths || 0, invuln: Date.now() < (u.invulnUntil || 0) };
  }
  roomState() {
    const v = this.vote;
    const el = this.eligible();
    return {
      t: 'room', serverNow: Date.now(), hostId: this.hostId, ownerId: this.ownerId, botsOn: this.botsOn, sparOn: this.sparOn, pvp: this.pvp, hasAdminPw: !!(this.adminPw || CONFIG.ADMIN_PASSWORD),
      users: [...this.users.values()].map(u => this.pub(u)),
      queue: this.queue, now: this.now, trays: this.trays,
      vote: v && { id: v.id, type: v.type, by: v.by, byName: v.byName, startedAt: v.startedAt, endsAt: v.endsAt, choices: v.choices,
        item: v.item, eligible: el.length, need: Math.floor(el.length / 2) + 1 },
    };
  }
  broadcastPositions() {
    const t = Date.now();
    if (this._posSent === this._posVer && t - this._posAt < 1000) return;
    this._posSent = this._posVer; this._posAt = t;
    const l = [];
    for (const u of this.users.values()) if (u.pos) l.push([u.id, +u.pos[0].toFixed(2), +u.pos[1].toFixed(2), +u.pos[2].toFixed(2), +(u.ry || 0).toFixed(2)]);
    this.send('*', { t: 'pos', l });
  }
  pickHost() {
    // 방을 연 기기 → 숨은 방장 열쇠를 가진 사람 → 먼저 들어온 사람 순서 (방장이 나가면 다음 사람에게 자동으로 넘어감)
    const humans = [...this.users.values()].filter(u => !u.isBot).sort((a, b) => (b.id === this.ownerId) - (a.id === this.ownerId) || !!b.owner - !!a.owner || a.joinedAt - b.joinedAt);
    const h = humans[0]?.id || null;
    if (h !== this.hostId) { this.hostId = h; if (h) this.sys(`👑 ${this.users.get(h).name} 님이 방장이 됐어요`); this.dirty(); }
  }
  uniqueName(name, selfId) {
    let base = String(name || '').replace(/\s+/g, ' ').trim().slice(0, 12) || '관객';
    const taken = n => [...this.users.values()].some(u => u.id !== selfId && u.name === n);
    let n = base, i = 2; while (taken(n)) n = `${base}${i++}`;
    return n;
  }

  // ---------- 봇 ----------
  spawnBots() {
    const free = L.seats.filter(s => s.row >= 2 && s.row <= 6 && s.col >= 3 && s.col <= 10 && !this.seatTaken(s.id));
    BOT_PROFILES.slice(0, CONFIG.BOT_COUNT).forEach((p, i) => {
      const id = 'bot-' + i; if (this.users.has(id)) return;
      const seat = free.splice(Math.floor(Math.random() * free.length), 1)[0];
      const t = Date.now();
      this.users.set(id, { id, sessionId: id, name: p.name, color: p.color, isBot: true, joinedAt: t, lastSeen: t,
        lastActive: p.sleepy ? t - CONFIG.AWAY_MS - 60000 : t, sleepy: !!p.sleepy, seat: seat?.id || null, zone: 'theater',
        pos: seat ? [seat.x, seat.y, seat.z] : [0, 0, 0], ry: 0, wear: { face: null, head: null, ...p.wear }, hold: p.hold, eating: null });
    });
    this._posVer++; this.dirty();
  }
  removeBots() {
    for (const u of [...this.users.values()]) if (u.isBot && !u.sparring) { this.users.delete(u.id); delete this.trays[u.seat]; }
    if (this.vote) this.evalVote(false);
    this._posVer++; this.dirty();
  }
  botTick() {
    const t = Date.now();
    for (const u of this.users.values()) {
      if (!u.isBot || u.sleepy || u.dead) continue;
      if (!u.eating && Math.random() < 0.004) {
        const k = SNACK_MENU[Math.floor(Math.random() * SNACK_MENU.length)];
        u.eating = { key: k, until: t + 7000 }; u.lastActive = t; this.dirty();
      }
      if (Math.random() < 0.0012) { u.lastActive = t; this.talk(u, BOT_LINES[Math.floor(Math.random() * BOT_LINES.length)]); }
      const v = this.vote;
      if (v && !(u.id in v.choices)) {
        u._vd ??= 2000 + Math.random() * 7000;
        if (t - v.startedAt > u._vd) {
          v.choices[u.id] = v.type === 'skip' ? (Math.random() < 0.6 ? 'yes' : 'no') : (Math.random() < 0.5 ? 'a' : 'b');
          u.lastActive = t; this.evalVote(false); this.dirty();
        }
      } else if (!v) u._vd = undefined;
    }
  }

  // ---------- 좌석 ----------
  seatTaken(id) { for (const u of this.users.values()) if (u.seat === id) return u; return null; }
  returnTray(u) {
    const tray = this.trays[u.seat]; if (!tray) return;
    let lost = 0;
    for (const k of tray) { if (!this.canAdd(this.bagOf(u), [k])) this.addItems(u, [k]); else lost++; }
    delete this.trays[u.seat];
    if (lost) this.toast(u.id, `가방이 꽉 차서 트레이 먹거리 ${lost}개는 두고 왔어요`);
    this.sendBag(u);
  }

  // ---------- 영상 ----------
  startNext(reason) {
    const prev = this.now;
    console.debug('[server] 다음 영상으로:', reason || 'queue');
    this.now = null;
    if (this.vote) this.vote = null;
    const item = this.queue.shift();
    if (item) {
      this.now = { item, startedAt: Date.now() + 1200, duration: item.duration || null };
      this.sys(`▶ 상영 시작: ${this.label(item)} (신청 ${item.byName})`);
    } else if (prev) this.sys('예약이 비었어요. 오른쪽 위에 유튜브 주소를 넣어 다음 영상을 예약하세요');
    this.dirty();
  }
  elapsed() { return this.now ? (Date.now() - this.now.startedAt) / 1000 : 0; }

  // ---------- 투표 ----------
  evalVote(final) {
    const v = this.vote; if (!v) return;
    const el = this.eligible(), ids = new Set(el.map(u => u.id));
    const cnt = c => Object.entries(v.choices).filter(([id, ch]) => ids.has(id) && ch === c).length;
    const need = Math.floor(el.length / 2) + 1;
    if (v.type === 'skip') {
      const yes = cnt('yes'), no = cnt('no');
      if (yes >= need) { this.vote = null; this.sys(`⏭ 넘기기 투표 통과 (찬성 ${yes}/${el.length})`); this.startNext('vote'); return; }
      if (final || el.length - no < need) { this.vote = null; this.sys(`넘기기 투표 부결 (찬성 ${yes}, 반대 ${no}, 투표 가능 ${el.length}명)`); this.dirty(); }
      return;
    }
    // 싸움 투표: a = 지금 영상 계속, b = 도전 영상
    const a = cnt('a'), b = cnt('b'), voted = a + b;
    const decided = a >= need || b >= need || voted >= el.length || final;
    if (!decided) return;
    this.vote = null;
    const idx = this.queue.findIndex(q => q.id === v.item.id);
    if (b > a) {
      if (idx >= 0) { const [ch] = this.queue.splice(idx, 1); this.queue.unshift(ch); }
      this.sys(`⚔️ 싸움 투표: 도전 영상 승리 (${b}:${a}) — 바로 상영해요`);
      this.startNext('fight');
    } else if (a > b) {
      if (idx >= 0) this.queue.splice(idx, 1);
      this.sys(`⚔️ 싸움 투표: 지금 영상 승리 (${a}:${b}) — 도전 영상은 예약에서 빠져요`);
      this.dirty();
    } else { this.sys(`⚔️ 싸움 투표 무승부 (${a}:${b}) — 그대로 진행해요`); this.dirty(); }
  }

  // ---------- 주기 처리 ----------
  tick() {
    const t = Date.now(); this._lastTick = t;
    for (const u of [...this.users.values()]) {
      if (!u.isBot && t - u.lastSeen > 12000) this.leave(u.id, true);
      if (u.eating && t > u.eating.until) { u.eating = null; this.dirty(); }
      const away = this.isAway(u);
      if (away !== u._away) { u._away = away; this.dirty(); if (this.vote) this.evalVote(false); }
    }
    if (this.now) {
      const n = this.now, dur = n.duration;
      if (dur && t > n.startedAt + (dur - (n.item.start || 0)) * 1000 + 1500) this.startNext('ended');
    } else if (this.queue.length) this.startNext();
    if (this.vote && t >= this.vote.endsAt) this.evalVote(true);
    this.combatTick(t);
    if (this.botsOn) this.botTick();
  }

  leave(id, timeout) {
    const u = this.users.get(id); if (!u) return;
    if (u.seat) this.returnTray(u);
    this.users.delete(id);
    if (this.vote) { delete this.vote.choices[id]; this.evalVote(false); }
    this.sys(`${u.name} 님이 나갔어요${timeout ? ' (연결 끊김)' : ''}`);
    this._posVer++; this.pickHost(); this.dirty();
  }
  talk(u, text) {
    const m = { t: 'chat', kind: 'talk', id: u.id, name: u.name, color: u.color, text, at: Date.now() };
    this.chatLog.push(m); if (this.chatLog.length > 80) this.chatLog.shift();
    this.send('*', m);
  }

  // ---------- 요청 처리 ----------
  receive(id, m) {
    if (!m || typeof m.t !== 'string') return;
    // 서버 탭이 백그라운드여서 타이머가 늦어져도, 요청이 올 때마다 밀린 처리를 돌림
    if (Date.now() - (this._lastTick || 0) > 450) this.tick();
    const u = this.users.get(id);
    if (m.t === 'hello') return this.onHello(id, m);
    if (!u) { if (m.t !== 'bye') this.send(id, { t: 'rehello' }); return; }
    u.lastSeen = Date.now();
    const active = () => { u.lastActive = Date.now(); if (u._away) { u._away = false; this.dirty(); if (this.vote) this.evalVote(false); } };
    const isHost = this.hostId === id, isAdmin = !!u.admin;
    switch (m.t) {
      case 'ping': return;
      case 'bye': return this.leave(id);
      case 'act': return active();
      case 'move': {
        const p = m.p; if (!Array.isArray(p) || p.length !== 3 || !p.every(Number.isFinite)) return;
        if (u.seat || u.dead) return; // 앉아 있거나 쓰러져 있으면 위치는 서버가 정함
        u.pos = p.map(v => clamp(v, -60, 60)); u.ry = Number.isFinite(m.ry) ? m.ry : 0;
        u.zone = L.zoneAt(u.pos[0], u.pos[2]); this._posVer++;
        if (u.zone !== u._zone) { u._zone = u.zone; this.dirty(); }
        if (Date.now() - this._posAt > 90) this.broadcastPositions();
        return;
      }
      case 'look': { if (Number.isFinite(m.ry)) { u.ry = m.ry; this._posVer++; } return; }
      case 'profile': {
        u.name = this.uniqueName(m.name, id); if (AVATAR_COLORS.includes(m.color)) u.color = m.color;
        active(); return this.dirty();
      }
      case 'chat': {
        const text = String(m.text || '').replace(/\s+/g, ' ').trim().slice(0, 200); if (!text) return;
        // 방장 명령은 채팅으로 절대 내보내지 않음 (예전 화면에서 보내도 안전하게)
        const oc = text.match(/^\/(방장|host)(?:\s+(.*))?$/i);
        if (oc) return this.receive(id, { t: 'owner', key: oc[2] || '' });
        if (!this.rate(id, 'chat', 600)) return this.toast(id, '조금 천천히 말해 주세요', true);
        active(); return this.talk(u, text);
      }
      case 'queueAdd': {
        active();
        const vid = String(m.videoId || ''); if (!/^[A-Za-z0-9_-]{11}$/.test(vid)) return this.toast(id, '유튜브 주소를 알아보지 못했어요', true);
        if (!this.rate(id, 'queue', 1500)) return this.toast(id, '예약은 1.5초에 한 번씩 할 수 있어요', true);
        if (this.queue.some(q => q.videoId === vid) || this.now?.item.videoId === vid) return this.toast(id, '이미 예약됐거나 상영 중인 영상이에요', true);
        const mine = this.queue.filter(q => q.sessionId === u.sessionId).length;
        if (mine >= CONFIG.MAX_QUEUE_PER_USER) return this.toast(id, `예약은 한 사람당 ${CONFIG.MAX_QUEUE_PER_USER}개까지예요`, true);
        const item = { id: this.nid(), videoId: vid, start: clamp(Math.floor(+m.start || 0), 0, 36000), title: String(m.title || '').slice(0, 120),
          by: id, byName: u.name, sessionId: u.sessionId, priority: false, addedAt: Date.now() };
        if (m.priority) {
          if (!isHost) return this.toast(id, '우선 예약은 방장만 쓸 수 있어요', true);
          const used = this.prioUsed[u.sessionId] || 0;
          if (used >= CONFIG.HOST_PRIORITY_LIMIT) return this.toast(id, `우선 예약은 세션당 ${CONFIG.HOST_PRIORITY_LIMIT}번까지예요`, true);
          this.prioUsed[u.sessionId] = used + 1; item.priority = true;
          const at = this.queue.findIndex(q => !q.priority);
          this.queue.splice(at < 0 ? this.queue.length : at, 0, item);
          this.sys(`⭐ ${u.name} 님이 우선 예약했어요: ${this.label(item)} (남은 우선 예약 ${CONFIG.HOST_PRIORITY_LIMIT - used - 1}번)`);
          this.sendBag(u);
        } else {
          this.queue.push(item);
          this.sys(`📋 ${u.name} 님이 예약했어요: ${this.label(item)}`);
        }
        if (!this.now) this.startNext();
        return this.dirty();
      }
      case 'queueRemove': {
        active();
        const i = this.queue.findIndex(q => q.id === m.itemId); if (i < 0) return;
        const q = this.queue[i];
        if (q.sessionId !== u.sessionId && !isHost && !isAdmin) return this.toast(id, '내 예약만 뺄 수 있어요', true);
        this.queue.splice(i, 1);
        if (this.vote?.item?.id === q.id) this.vote = null;
        this.sys(`${u.name} 님이 예약을 뺐어요: ${this.label(q)}`);
        return this.dirty();
      }
      case 'cleanupLeft': {
        if (!isHost && !isAdmin) return this.toast(id, '방장만 쓸 수 있어요', true);
        const here = new Set([...this.users.values()].map(x => x.sessionId));
        const before = this.queue.length;
        this.queue = this.queue.filter(q => here.has(q.sessionId));
        const n = before - this.queue.length;
        if (this.vote?.item && !this.queue.some(q => q.id === this.vote.item.id)) this.vote = null;
        if (n) this.sys(`🧹 ${u.name} 님이 나간 사람 예약 ${n}개를 정리했어요`); else this.toast(id, '정리할 예약이 없어요');
        return this.dirty();
      }
      case 'voteStart': {
        if (this.isAway(u)) active();
        active();
        if (!this.now) return this.toast(id, '지금 상영 중인 영상이 없어요', true);
        if (this.vote) return this.toast(id, '이미 투표가 진행 중이에요', true);
        if (!this.rate(id, 'vote', 20000)) return this.toast(id, '투표는 20초에 한 번만 열 수 있어요', true);
        const t = Date.now();
        if (m.type === 'skip') {
          this.vote = { id: this.nid(), type: 'skip', by: id, byName: u.name, startedAt: t, endsAt: t + CONFIG.VOTE_MS, choices: { [id]: 'yes' }, item: null };
          this.sys(`⏭ ${u.name} 님이 넘기기 투표를 열었어요`);
        } else if (m.type === 'fight') {
          const q = this.queue.find(x => x.id === m.itemId); if (!q) return this.toast(id, '그 예약을 찾지 못했어요', true);
          this.vote = { id: this.nid(), type: 'fight', by: id, byName: u.name, startedAt: t, endsAt: t + CONFIG.VOTE_MS, choices: { [id]: 'b' },
            item: { id: q.id, videoId: q.videoId, title: q.title, byName: q.byName } };
          this.sys(`⚔️ ${u.name} 님이 싸움 투표를 열었어요: 지금 영상 vs ${this.label(q)}`);
        } else return;
        this.evalVote(false); return this.dirty();
      }
      case 'vote': {
        const v = this.vote; if (!v || v.id !== m.voteId) return;
        const ok = v.type === 'skip' ? ['yes', 'no'] : ['a', 'b']; if (!ok.includes(m.choice)) return;
        active();
        v.choices[id] = m.choice; this.evalVote(false); return this.dirty();
      }
      case 'adminSkip': {
        if (!isAdmin) return this.toast(id, '운영진만 바로 넘길 수 있어요', true);
        if (!this.now) return;
        active(); this.sys(`🛡 운영진 ${u.name} 님이 영상을 넘겼어요`); return this.startNext('admin');
      }
      case 'videoInfo': {
        const n = this.now; if (!n || n.item.videoId !== m.videoId) return;
        let ch = false;
        if (!n.duration && Number.isFinite(m.duration) && m.duration > 1) { n.duration = m.duration; ch = true; }
        if (!n.item.title && m.title) { n.item.title = String(m.title).slice(0, 120); ch = true; }
        if (ch) this.dirty(); return;
      }
      case 'titleFor': {
        let ch = false;
        for (const q of this.queue) if (q.videoId === m.videoId && !q.title && m.title) { q.title = String(m.title).slice(0, 120); ch = true; }
        if (this.now?.item.videoId === m.videoId && !this.now.item.title && m.title) { this.now.item.title = String(m.title).slice(0, 120); ch = true; }
        if (ch) this.dirty(); return;
      }
      case 'videoEnded': {
        if (this.now?.item.videoId === m.videoId && this.elapsed() > 4) this.startNext('ended(client)'); return;
      }
      case 'videoError': {
        if (this.now?.item.videoId !== m.videoId) return;
        if ([2, 100, 101, 150].includes(m.code)) { this.sys(`⚠ 이 영상은 퍼가기가 막혀 있거나 없어서 넘겨요 (오류 ${m.code})`, true); this.startNext('error'); }
        return;
      }
      case 'sit': {
        const s = L.seatById[m.seatId]; if (!s) return;
        if (u.seat) return this.toast(id, '이미 앉아 있어요', true);
        if (u.dead) return;
        const other = this.seatTaken(s.id); if (other) return this.toast(id, `${other.name} 님 자리예요`, true);
        if (u.pos && Math.hypot(u.pos[0] - s.x, u.pos[2] - s.z) > 3) return this.toast(id, '좌석에 더 가까이 가 주세요', true);
        active(); u.seat = s.id; u.pos = [s.x, s.y, s.z]; u.ry = 0; u.zone = 'theater'; this._posVer++;
        this.send(id, { t: 'sat', seatId: s.id }); return this.dirty();
      }
      case 'stand': {
        if (!u.seat) return;
        active(); const s = L.seatById[u.seat]; this.returnTray(u); u.seat = null;
        if (s) { u.pos = [s.stand.x, s.y, s.stand.z]; this._posVer++; }
        this.send(id, { t: 'stood' }); return this.dirty();
      }
      case 'buy': {
        active();
        if (!this.rate(id, 'buy', 450)) return;
        let keys = null;
        if (m.shop === 'snack') keys = SNACK_MENU.includes(m.id) ? [m.id] : COMBOS.find(c => c.id === m.id)?.items;
        else if (m.shop === 'vending') keys = VENDING.includes(m.id) ? [m.id] : null;
        else if (m.shop === 'goods') keys = GOODS.includes(m.id) ? [m.id] : null;
        if (!keys) return;
        const err = this.canAdd(this.bagOf(u), keys); if (err) return this.toast(id, err, true);
        this.addItems(u, keys); this.sendBag(u);
        const combo = COMBOS.find(c => c.id === m.id);
        return this.toast(id, combo ? `${combo.name} 받았어요 (${keys.map(k => ITEMS[k].emoji).join('')})` : `${ITEMS[keys[0]].emoji} ${ITEMS[keys[0]].name} 받았어요`);
      }
      case 'use': {
        const k = m.key, it = ITEMS[k], bag = this.bagOf(u); if (!it || !(bag[k] > 0)) return;
        active();
        if (it.kind === 'food' || it.kind === 'drink') {
          if (u.eating) return this.toast(id, '아직 먹는 중이에요', true);
          this.takeItem(u, k); u.eating = { key: k, until: Date.now() + (it.kind === 'food' ? 7000 : 5000) };
        } else if (it.kind === 'wear') u.wear[it.slot] = u.wear[it.slot] === k ? null : k;
        else if (it.kind === 'hold') u.hold = u.hold === k ? null : k;
        else return this.toast(id, `${it.emoji} 소장품이라 가방에 잘 넣어 둘게요`);
        this.sendBag(u); return this.dirty();
      }
      case 'discard': {
        if (!this.takeItem(u, m.key)) return;
        active(); this.sendBag(u); return this.dirty();
      }
      case 'trayPut': {
        const k = m.key, it = ITEMS[k];
        if (!u.seat) return this.toast(id, '좌석에 앉아야 트레이를 쓸 수 있어요', true);
        if (!it || (it.kind !== 'food' && it.kind !== 'drink')) return this.toast(id, '트레이에는 먹거리만 올릴 수 있어요', true);
        const tray = (this.trays[u.seat] ||= []);
        if (tray.length >= CONFIG.TRAY_MAX) return this.toast(id, `트레이에는 ${CONFIG.TRAY_MAX}개까지 올릴 수 있어요`, true);
        if (!this.takeItem(u, k)) return;
        active(); tray.push(k); this.sendBag(u); return this.dirty();
      }
      case 'trayTake': {
        const tray = this.trays[u.seat]; if (!tray || !(m.i in tray)) return;
        const k = tray[m.i]; const err = this.canAdd(this.bagOf(u), [k]); if (err) return this.toast(id, err, true);
        active(); tray.splice(m.i, 1); if (!tray.length) delete this.trays[u.seat];
        this.addItems(u, [k]); this.sendBag(u); return this.dirty();
      }
      case 'piano': {
        const n = m.n | 0; if (n < 0 || n > 24) return;
        if (!this.rate(id, 'piano', 55)) return;
        if (Date.now() - u.lastActive > 15000) active(); else u.lastActive = Date.now();
        return this.send('*', { t: 'piano', n, id, x: u.pos?.[0] || 0, z: u.pos?.[2] || 0 });
      }
      case 'boardGet': return this.send(id, { t: 'board', board: this.board });
      case 'boardPost': {
        const text = String(m.text || '').trim().slice(0, 300); if (text.length < 2) return this.toast(id, '두 글자 이상 적어 주세요', true);
        if (!this.rate(id, 'post', 20000)) return this.toast(id, '건의는 20초에 한 번씩 올릴 수 있어요', true);
        active();
        this.board.push({ id: this.nid(), at: Date.now(), author: u.name, session: u.sessionId, text, reply: null });
        if (this.board.length > 100) this.board.shift();
        this.saveBoard(); this.toast(id, '건의사항을 올렸어요');
        return this.send('*', { t: 'board', board: this.board });
      }
      case 'boardReply': {
        if (!isAdmin) return this.toast(id, '운영진만 답변할 수 있어요', true);
        const p = this.board.find(x => x.id === m.postId); const text = String(m.text || '').trim().slice(0, 300); if (!p || !text) return;
        active(); p.reply = { by: u.name, text, at: Date.now() }; this.saveBoard();
        this.sys(`🛡 운영진이 건의사항에 답변했어요: "${p.text.slice(0, 24)}${p.text.length > 24 ? '…' : ''}"`);
        return this.send('*', { t: 'board', board: this.board });
      }
      case 'boardDelete': {
        const i = this.board.findIndex(x => x.id === m.postId); if (i < 0) return;
        if (!isAdmin && this.board[i].session !== u.sessionId) return this.toast(id, '내 글만 지울 수 있어요', true);
        this.board.splice(i, 1); this.saveBoard();
        return this.send('*', { t: 'board', board: this.board });
      }
      case 'admin': {
        if (!this.rate(id, 'admin', 1500)) return this.toast(id, '잠시 후 다시 시도해 주세요', true);
        if (!this.adminPw && !CONFIG.ADMIN_PASSWORD) return this.toast(id, '방장이 아직 운영진 비밀번호를 정하지 않았어요', true);
        if (!this.pwOk(m.pw)) return this.toast(id, '비밀번호가 맞지 않아요', true);
        u.admin = true; this.sys(`🛡 ${u.name} 님이 운영진으로 들어왔어요`); this.toast(id, '운영진으로 로그인했어요'); return this.dirty();
      }
      case 'attack': { active(); return this.attack(u, m.kind, m.p, m.ry); }
      case 'owner': {
        const key = String(m.key ?? '').trim();
        if (/^(해제|끄기|off)$/i.test(key) || m.off) {
          u.owner = false; this.send(id, { t: 'ownerOk', off: true }); this.toast(id, '이 기기에서 자동 방장을 껐어요');
          return this.pickHost();
        }
        if (!this.rate(id, 'owner', 2000)) return this.toast(id, '잠시 후 다시 시도해 주세요', true);
        if (!this.ownerOk(key)) return this.toast(id, '명령어가 맞지 않아요', true);
        u.owner = true; active(); this.send(id, { t: 'ownerOk', key });
        this.toast(id, '👑 방장을 가져왔어요. 이 기기로 다시 들어오면 자동으로 방장이 돼요');
        return this.pickHost();
      }
      case 'pvp': {
        if (!isHost && !isAdmin) return this.toast(id, '싸움 허용은 방장이 바꿀 수 있어요', true);
        this.pvp = !!m.on; this.sys(this.pvp ? '🥊 방장이 싸움을 켰어요. 주먹(F)과 발차기(G)를 쓸 수 있어요' : '🕊️ 방장이 싸움을 껐어요');
        return this.dirty();
      }
      case 'setAdminPw': {
        if (id !== this.ownerId) return this.toast(id, '방을 연 사람만 정할 수 있어요', true);
        this.adminPw = String(m.pw || '').trim().slice(0, 40);
        try { localStorage.setItem('starlight:adminpw', this.adminPw); } catch {}
        this.toast(id, this.adminPw ? '운영진 비밀번호를 정했어요' : '운영진 비밀번호를 지웠어요'); return this.dirty();
      }
      case 'sparring': {
        if (!isHost && !isAdmin) return this.toast(id, '봇 설정은 방장이 바꿀 수 있어요', true);
        this.sparOn = !!m.on;
        if (this.sparOn) this.spawnSparring(); else { this.users.delete(SPARRING.id); this._posVer++; }
        this.sys(this.sparOn ? '🥊 스파링봇이 로비에 나왔어요' : '🥊 스파링봇이 들어갔어요'); return this.dirty();
      }
      case 'bots': {
        if (!isHost && !isAdmin) return this.toast(id, '봇 설정은 방장이 바꿀 수 있어요', true);
        this.botsOn = !!m.on; if (this.botsOn) this.spawnBots(); else this.removeBots();
        this.sys(this.botsOn ? '🤖 테스트용 관객 봇이 들어왔어요' : '🤖 테스트용 관객 봇이 나갔어요'); return this.dirty();
      }
    }
  }
  onHello(id, m) {
    const t = Date.now();
    const sessionId = String(m.sessionId || id).slice(0, 40);
    for (const x of [...this.users.values()]) if (x.id !== id && x.sessionId === sessionId && !x.isBot) this.users.delete(x.id);
    let u = this.users.get(id), isNew = !u;
    if (!u) u = { id, sessionId, joinedAt: t, seat: null, zone: 'lobby', pos: null, ry: 0, wear: { face: null, head: null }, hold: null, eating: null, admin: false };
    u.name = this.uniqueName(m.name, id); u.color = AVATAR_COLORS.includes(m.color) ? m.color : AVATAR_COLORS[0];
    u.lastSeen = t; u.lastActive = t; this.fighter(u); this.users.set(id, u);
    // 서버가 바뀌어도 가방에 있던 착용·손 상태 이어가기
    if (isNew && m.wear) for (const s of ['face', 'head']) if (m.wear[s] && this.bagOf(u)[m.wear[s]]) u.wear[s] = m.wear[s];
    if (isNew && m.hold && this.bagOf(u)[m.hold]) u.hold = m.hold;
    if (isNew && m.admin && this.pwOk(m.admin)) u.admin = true;
    if (m.owner) u.owner = this.ownerOk(m.owner); // 저장해 둔 방장 열쇠로 조용히 들어옴
    if (id === this.ownerId) u.admin = true;
    this.send(id, { t: 'welcome', you: id, chat: this.chatLog.slice(-40), board: this.board });
    this.sendBag(u);
    if (isNew && !m.silent) this.sys(`${u.name} 님이 들어왔어요`);
    this._posVer++; this.pickHost(); this.dirty();
  }
}

// ============================================================
//  주먹다짐 — 맞았는지, 피가 얼마 남았는지, 언제 부활하는지는 전부 서버가 정함
//  (앉아 있는 사람은 안전, 부활 직후 잠깐 무적)
// ============================================================
const MOVES = {
  punch: { name: '주먹',   dmg: 10, spread: 3, range: 1.6, cone: 0.9,  cd: 420, kb: 0.3 },
  kick:  { name: '발차기', dmg: 18, spread: 4, range: 2.0, cone: 0.75, cd: 950, kb: 1.1 },
};
const SPARRING = { id: 'bot-spar', name: '스파링봇', color: '#F2A541', home: () => [-3.2, L.TOP_Y, L.LOBBY_Z0 + 2.6] };

Object.assign(CinemaServer.prototype, {
  fighter(u) {
    u.hp ??= CONFIG.HP_MAX; u.dead ??= false; u.kills ??= 0; u.deaths ??= 0; u.invulnUntil ??= 0; u.lastAtk ??= 0; u.lastHurt ??= 0;
    return u;
  },
  spawnSparring() {
    if (this.users.has(SPARRING.id)) return;
    const t = Date.now();
    this.users.set(SPARRING.id, this.fighter({ id: SPARRING.id, sessionId: SPARRING.id, name: SPARRING.name, color: SPARRING.color, isBot: true, sparring: true,
      joinedAt: t, lastSeen: t, lastActive: t, seat: null, zone: 'lobby', pos: SPARRING.home(), ry: 0, wear: { face: null, head: 'g_cap' }, hold: null, eating: null }));
  },
  attack(u, kind, p, ry) {
    const K = MOVES[kind]; if (!K) return;
    const now = Date.now(); this.fighter(u);
    if (!this.pvp) return this.toast(u.id, '지금은 방장이 싸움을 꺼 뒀어요', true);
    if (u.dead || u.seat || now - u.lastAtk < K.cd) return;
    u.lastAtk = now;
    // 공격하는 순간의 위치·방향은 클라이언트 값을 쓰되, 서버가 아는 위치와 너무 다르면 무시
    let pos = u.pos;
    if (Array.isArray(p) && p.length === 3 && p.every(Number.isFinite) && (!u.pos || Math.hypot(p[0] - u.pos[0], p[2] - u.pos[2]) < 1.5)) { pos = p; u.pos = p; }
    if (!pos) return;
    if (Number.isFinite(ry)) u.ry = ry;
    const fx = -Math.sin(u.ry || 0), fz = -Math.cos(u.ry || 0);
    let best = null, bd = 1e9;
    for (const t of this.users.values()) {
      if (t === u || !t.pos || t.seat) continue; this.fighter(t);
      if (t.dead || now < t.invulnUntil || Math.abs(t.pos[1] - pos[1]) > 1.0) continue;
      const dx = t.pos[0] - pos[0], dz = t.pos[2] - pos[2], d = Math.hypot(dx, dz);
      if (d > K.range) continue;
      if (d > 0.15 && (dx * fx + dz * fz) / d < Math.cos(K.cone)) continue; // 바라보는 방향 앞쪽만
      if (d < bd) { bd = d; best = t; }
    }
    this.send('*', { t: 'fx', k: 'swing', id: u.id, kind });
    if (!best) return;
    const dmg = K.dmg + Math.floor(Math.random() * (K.spread * 2 + 1)) - K.spread;
    best.hp = Math.max(0, best.hp - dmg); best.lastHurt = now;
    const kb = [+(fx * K.kb).toFixed(2), +(fz * K.kb).toFixed(2)];
    if (best.isBot && best.pos) { // 봇은 서버가 직접 밀어냄
      const nx = best.pos[0] + kb[0], nz = best.pos[2] + kb[1];
      if (L.walkable(nx, nz)) { best.pos = [nx, L.floorAt(nx, nz), nz]; this._posVer++; }
    }
    this.send('*', { t: 'fx', k: 'hit', from: u.id, to: best.id, kind, dmg, hp: best.hp, kb });
    if (best.hp <= 0) this.knockOut(best, u, kind);
    else if (best.sparring) this.counter(best, u);
    this.dirty();
  },
  knockOut(t, by, kind) {
    t.dead = true; t.respawnAt = Date.now() + CONFIG.RESPAWN_MS; t.deaths++; by.kills++;
    t.eating = null;
    this.sys(`💥 ${by.name} 님이 ${t.name} 님을 ${MOVES[kind].name}로 쓰러뜨렸어요`);
    this.send('*', { t: 'fx', k: 'down', id: t.id, by: by.id });
  },
  respawn(t) {
    t.dead = false; t.hp = CONFIG.HP_MAX; t.invulnUntil = Date.now() + 2500; t.lastHurt = 0;
    const home = t.sparring ? SPARRING.home() : [L.SPAWN.x, L.TOP_Y, L.SPAWN.z];
    t.pos = home; t.ry = t.sparring ? 0 : L.SPAWN.yaw; t.zone = 'lobby'; this._posVer++;
    if (!t.isBot) this.send(t.id, { t: 'respawn', x: home[0], z: home[2] });
    this.send('*', { t: 'fx', k: 'respawn', id: t.id });
    this.dirty();
  },
  // 스파링봇: 맞으면 때린 사람 쪽을 보고 받아침
  counter(bot, target) {
    if (bot._counterAt && Date.now() - bot._counterAt < 900) return;
    if (Math.random() > 0.55) return; // 매번 받아치진 않음
    bot._counterAt = Date.now();
    setTimeout(() => {
      if (!this.users.has(bot.id) || bot.dead || !target.pos || !this.users.has(target.id)) return;
      const dx = target.pos[0] - bot.pos[0], dz = target.pos[2] - bot.pos[2];
      if (Math.hypot(dx, dz) > 2.2) return;
      bot.ry = Math.atan2(-dx, -dz); this._posVer++;
      this.attack(bot, Math.random() < 0.15 ? 'kick' : 'punch', null, bot.ry);
    }, 380 + Math.random() * 250);
  },
  combatTick(now) {
    for (const u of this.users.values()) {
      this.fighter(u);
      // 스파링봇은 밀려나면 제자리로 천천히 돌아감
      if (u.sparring && !u.dead && u.pos) {
        const h = SPARRING.home(), dx = h[0] - u.pos[0], dz = h[2] - u.pos[2], d = Math.hypot(dx, dz);
        if (d > 0.05 && now - u.lastHurt > 1200) { const k = Math.min(1, 0.45 / d); u.pos = [u.pos[0] + dx * k, h[1], u.pos[2] + dz * k]; this._posVer++; }
      }
      if (u.dead && now >= u.respawnAt) this.respawn(u);
      else if (!u.dead && u.hp < CONFIG.HP_MAX && now - u.lastHurt > 6000) { u.hp = Math.min(CONFIG.HP_MAX, u.hp + 2); this.dirty(); }
    }
  },
});

/*@shared-end*/
// ============================================================
//  연결 — 같은 브라우저의 탭끼리 BroadcastChannel로 이어 줌
//  탭 하나가 서버 역할(Web Locks로 한 탭만 선출), 그 탭이 닫히면 다음 탭이 이어받음
//  ※ 다른 컴퓨터·폰과 같이 보려면 이 부분을 WebSocket 서버로 바꾸면 됨 (send/onMessage 모양 그대로)
// ============================================================
class LocalNet {
  constructor() {
    this.id = rid(12);
    this.server = null; this.serverId = null; this.lastBeat = 0; this.backup = null;
    this.onMessage = () => {}; this.onServer = () => {};
    try { this.ch = new BroadcastChannel(CONFIG.CHANNEL); } catch { this.ch = null; }
  }
  get isServer() { return !!this.server; }
  start() {
    if (this.ch) this.ch.onmessage = e => this.onChannel(e.data);
    if (!this.ch) return this.becomeServer();
    let viaLock = false;
    try {
      if (navigator.locks?.request) {
        navigator.locks.request(CONFIG.CHANNEL + ':server', () => { this.becomeServer(); return new Promise(() => {}); })
          .catch(() => this.watchdog());
        viaLock = true;
      }
    } catch { viaLock = false; }
    if (!viaLock) this.watchdog();
    // 잠금 기능이 있어도 응답이 없는 환경 대비: 2.5초 안에 서버 신호가 없으면 직접 서버가 됨
    setTimeout(() => { if (!this.server && !this.lastBeat) this.becomeServer(); }, 2500);
  }
  watchdog() {
    setTimeout(() => { if (!this.server && Date.now() - this.lastBeat > 1500) this.becomeServer(); }, 1300);
    setInterval(() => { if (!this.server && this.lastBeat && Date.now() - this.lastBeat > 4500) this.becomeServer(); }, 1500);
  }
  becomeServer() {
    if (this.server) return;
    this.server = new CinemaServer((to, m) => this.fromServer(to, m), this.backup);
    this.serverId = this.id; this.server.ownerId = this.id;
    // 이 탭이 서버가 되면 다른 기기도 들어올 수 있게 방을 엶
    this.hub = new PeerHub(this); this.hub.onStatus = () => this.onHubStatus?.(); this.hub.start();
    const beat = () => this.ch?.postMessage({ k: 'beat', sid: this.id });
    beat(); setInterval(beat, 1000);
    setInterval(() => this.ch?.postMessage({ k: 'backup', s: this.server.snapshot() }), 2000);
    this.onServer(true);
  }
  fromServer(to, m) {
    // 같은 탭 안에서도 네트워크처럼 복사본을 넘겨서, 화면 쪽이 서버 상태를 직접 건드리지 못하게 함
    if (to === '*' || to === this.id) { const c = structuredClone(m); queueMicrotask(() => this.onMessage(c)); }
    if (to !== this.id && this.ch) this.ch.postMessage({ k: 's', to, m });
    if (to !== this.id && this.hub) this.hub.send(to, m);
  }
  send(m) {
    if (this.server) { const id = this.id, c = structuredClone(m); queueMicrotask(() => this.server.receive(id, c)); }
    else if (this.ch) this.ch.postMessage({ k: 'c', from: this.id, m });
  }
  onChannel(d) {
    if (!d) return;
    if (d.k === 'c') { if (this.server) this.server.receive(d.from, d.m); }
    else if (d.k === 's') { if (d.to === '*' || d.to === this.id) this.onMessage(d.m); }
    else if (d.k === 'beat') {
      this.lastBeat = Date.now();
      if (!this.server && d.sid !== this.serverId) { this.serverId = d.sid; this.onServer(false); }
    } else if (d.k === 'backup') { if (!this.server) this.backup = d.s; }
  }
}

// ============================================================
//  다른 기기와 연결 — 방장 기기의 브라우저가 서버 역할을 하고, 손님은 초대 링크로 들어옴
//  기기끼리 WebRTC로 직접 이어 줌 (처음 서로를 찾을 때만 PeerJS 무료 중계 서버를 거침)
//  방장이 이 페이지를 켜 둔 동안에만 방이 열려 있음
// ============================================================
const PEER_LIBS = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
const PEER_PREFIX = 'starlight-cinema-';
const ROOM_PARAM = (() => {
  try { const r = new URLSearchParams(location.search).get('room'); return r && /^[A-Za-z0-9]{4,12}$/.test(r) ? r.toUpperCase() : null; } catch { return null; }
})();
const peerOptions = () => Object.assign({ debug: 0 }, CONFIG.PEER_OPTIONS || {}, window.__peerOptions || {});
let peerLib = null;
function loadPeerLib() {
  if (window.Peer) return Promise.resolve(window.Peer);
  return (peerLib ||= (async () => {
    for (const src of PEER_LIBS) {
      try {
        await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
        if (window.Peer) return window.Peer;
      } catch {}
    }
    peerLib = null; throw new Error('PeerJS를 불러오지 못함');
  })());
}
// 방 코드는 방장 기기에 저장해 두고 계속 씀 → 초대 링크가 매번 같음
function myRoomCode() {
  try { let c = localStorage.getItem('starlight:room'); if (!c) { c = rid(6).toUpperCase(); localStorage.setItem('starlight:room', c); } return c; }
  catch { return (window.__roomCode ||= rid(6).toUpperCase()); }
}
function inviteLink(code) { return `${location.origin}${location.pathname}?room=${code}`; }
const NET_ERR = t => ({
  'browser-incompatible': '이 브라우저는 기기 간 연결(WebRTC)을 지원하지 않아요',
  'unavailable-id': '이 방은 이미 다른 창이나 기기에서 열려 있어요',
  'ssl-unavailable': '인터넷 주소(https)로 연 페이지에서만 방을 열 수 있어요',
}[t] || '');

// ---------- 방장 쪽: 손님 연결을 받아 서버로 넘김 ----------
class PeerHub {
  constructor(net) { this.net = net; this.code = myRoomCode(); this.conns = new Map(); this.status = 'idle'; this.err = ''; this.onStatus = () => {}; }
  get guests() { return this.conns.size; }
  set(status, err = '') { this.status = status; this.err = err; try { this.onStatus(); } catch {} }
  async start() {
    this.set('connecting');
    try { await loadPeerLib(); } catch { return this.set('error', '연결 도구(PeerJS)를 내려받지 못했어요. 인터넷 연결을 확인해 주세요'); }
    this.open();
  }
  open() {
    try { this.peer?.destroy(); } catch {}
    let peer;
    try { peer = this.peer = new Peer(PEER_PREFIX + this.code, peerOptions()); } catch (e) { return this.set('error', '방을 열지 못했어요'); }
    peer.on('open', () => this.set('open'));
    peer.on('connection', c => this.accept(c));
    peer.on('disconnected', () => {
      if (this.status === 'error' || peer !== this.peer) return;
      this.set('connecting', '중계 서버에 다시 연결하는 중이에요');
      setTimeout(() => { try { if (peer === this.peer && !peer.destroyed) peer.reconnect(); } catch {} }, 1500);
    });
    peer.on('error', e => {
      const msg = NET_ERR(e?.type);
      if (msg) return this.set('error', msg);
      if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(e?.type)) {
        this.set('connecting', '중계 서버에 다시 연결하는 중이에요');
        clearTimeout(this._rt); this._rt = setTimeout(() => { if (this.status !== 'open') this.open(); }, 4000);
      } else console.warn('방 연결 오류', e?.type, e);
    });
  }
  accept(conn) {
    // 손님 구분은 손님이 보낸 값이 아니라 연결 자체의 ID로 함 (남인 척 못 하게)
    const cid = 'p-' + conn.peer;

// ---------- 손님 쪽: 방장 기기에 붙어서 메시지를 주고받음 ----------
class RemoteNet {
  constructor(code) {
    this.id = rid(12); this.code = code; this.server = null; this.hub = null;
    this.onMessage = () => {}; this.onServer = () => {}; this.onStatus = () => {};

  }
  get isServer() { return false; }
  set(status, err = '') { this.status = status; this.err = err; try { this.onStatus(); } catch {} }

    if (this.peer) return;
    this.set('connecting');

    let peer;
    try { peer = this.peer = new Peer(undefined, peerOptions()); } catch { return this.set('error', '연결을 시작하지 못했어요'); }
    peer.on('open', () => { this.dial(); this.retry(1e9); });

    peer.on('error', e => {
      const msg = NET_ERR(e?.type);
      if (msg) return this.set('error', msg);

    });
  }

    conn.on('data', m => { this.lastRx = Date.now(); this.onMessage(m); });

    this._wd ||= setInterval(() => {

        const c = this.conn; this.conn = null; try { c?.close(); } catch {}
        this.set('closed', '방장과 연결이 끊겼어요. 다시 연결하는 중이에요'); this.retry(1500);
      }
    }, 2000);
  }
  send(m) { if (this.conn?.open) try { this.conn.send({ k: 'c', m }); } catch {} }
}

//  서버 모드 — Render 등에 올린 server.js가 이 페이지를 보내 주면, 그 서버에 웹소켓으로 붙음

// ============================================================
const SERVER_MODE = !!window.__WS_SERVER__;

  constructor() {
    this.id = rid(12); this.server = null; this.hub = null; this.ws = null; this.tries = 0;
    this.onMessage = () => {}; this.onServer = () => {}; this.onStatus = () => {};
    this.status = 'idle'; this.err = '';
  }
  get isServer() { return false; }
  set(status, err = '') { this.status = status; this.err = err; try { this.onStatus(); } catch {} }
  start() { if (!this.ws) this.connect(); }
  connect() {
    this.set('connecting', this.tries ? '서버에 다시 연결하는 중이에요' : '');
    let ws;
    try { ws = this.ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`); }
    catch { this.ws = null; return this.retry(); }

    if (this.api === 'failed') return;
    this.api = 'failed'; this.failMsg = msg; this.sync();
    UI.toast('이 창에서는 유튜브 영상이 안 나와요. 파일을 받아 로컬 서버나 웹호스팅 주소로 열면 나와요', true);
  },
  create() {
    const pv = { controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3, playsinline: 1, modestbranding: 1, autoplay: 0 };
    if (location.protocol.startsWith('http')) pv.origin = location.origin;
    this.player = new YT.Player(W.screen.host.querySelector('#yt'), {
      width: 1430, height: 1000, playerVars: pv,
      events: {
        onReady: () => { this.api = 'ready'; this.applyVolume(); this.sync(); },
        onStateChange: e => this.onState(e.data),
        onError: e => this.onError(e.data),
      },
    });
  },
  onState(st) {
    if (st === YT.PlayerState.ENDED && this.curId) net.send({ t: 'videoEnded', videoId: this.curId });
    if (st === YT.PlayerState.PLAYING) this.checkSound();
  },
  onError(code) {
    if (this.curId) net.send({ t: 'videoError', videoId: this.curId, code });
    if ((code === 153 || code === 152) && !this.warned153) {
      this.warned153 = true;
      UI.toast('이 주소로 연 페이지에선 유튜브가 재생을 막아요. 로컬 서버나 웹호스팅 주소로 열어 주세요', true);
    }
  },
  setFactor(f) { if (f !== this.factor) { this.factor = f; this.applyVolume(); } },
  setVolume(v) { this.vol = v; this.applyVolume(); },
  applyVolume() { try { this.player?.setVolume?.(Math.round(this.vol * this.factor)); } catch {} },
  checkSound() {
    try {
      const muted = this.player?.isMuted?.();
      document.getElementById('soundBtn').hidden = !(muted && this.curId && !document.body.classList.contains('modal-open'));
    } catch {}
  },
  unmute() {
    try { this.player.unMute(); this.applyVolume(); this.player.playVideo(); } catch {}
    document.getElementById('soundBtn').hidden = true;
  },
  position() { const n = S.room?.now; return n ? (n.item.start || 0) + (clock.now() - n.startedAt) / 1000 : 0; },
  sync() {
    const n = S.room?.now;
    if (!n) {
      if (this.curId || this.cuedId) { try { this.player?.stopVideo?.(); } catch {} this.curId = this.cuedId = null; }
      document.getElementById('soundBtn').hidden = true;
      setScreenMode(false, this.api === 'failed' ? this.failMsg : '');
      return;
    }
    if (this.api !== 'ready') {
      setScreenMode(false, this.api === 'failed' ? this.failMsg : '유튜브를 불러오는 중이에요');
      return;
    }
    setScreenMode(true);
    const p = this.player, id = n.item.videoId, pos = this.position(), PS = YT.PlayerState;
    const rel = (clock.now() - n.startedAt) / 1000; // 서버가 정한 시작 시각에서 몇 초 지났는지
    try {
      if (rel < -0.25) {
        if (this.cuedId !== id) { this.cuedId = id; this.curId = null; p.cueVideoById({ videoId: id, startSeconds: n.item.start || 0 }); }
        return;
      }
      if (this.curId !== id) {
        this.curId = id; this.lastSeek = this.loadAt = performance.now();
        if (this.cuedId === id) { p.seekTo(Math.max(0, pos), true); p.playVideo(); }
        else p.loadVideoById({ videoId: id, startSeconds: Math.max(0, pos) });
        this.cuedId = null;
        return;
      }
      const st = p.getPlayerState();
      if (st === PS.ENDED) return;
      if (st === PS.PAUSED || st === PS.CUED || st === -1) {
        p.playVideo();
        // 소리 있는 자동재생이 막힌 브라우저면 음소거로라도 재생하고 '소리 켜기' 버튼을 띄움
        if (performance.now() - this.loadAt > 3500 && !p.isMuted()) { p.mute(); p.playVideo(); }
      }
      const cur = p.getCurrentTime() || 0;
      if (st !== PS.BUFFERING && Math.abs(cur - pos) > 2.5 && performance.now() - this.lastSeek > 3000) { p.seekTo(pos, true); this.lastSeek = performance.now(); }
      if (!this.infoSent.has(id)) {
        const d = p.getDuration(), t = p.getVideoData?.()?.title;
        if (d > 0) { this.infoSent.add(id); net.send({ t: 'videoInfo', videoId: id, duration: d, title: t || '' }); }
      }
      this.checkSound();
    } catch (e) { console.warn('video sync', e); }
  },
};

// 예약할 때 제목을 미리 알아오기 (안 되면 서버가 재생 중에 채움)
async function fetchTitle(videoId) {
  const url = encodeURIComponent(`https://www.youtube.com/watch?v=${videoId}`);
  for (const ep of [`https://www.youtube.com/oembed?format=json&url=${url}`, `https://noembed.com/embed?url=${url}`]) {
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 2500);
      const r = await fetch(ep, { signal: ctl.signal }); clearTimeout(to);
      if (r.ok) { const j = await r.json(); if (j.title) return String(j.title); }
    } catch {}
  }
  return '';
}

const Piano = {
  ctx: null, master: null,
  init() {
    if (this.ctx) { this.ctx.resume?.(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination); } catch {}
  },
  play(n, gain = 1) {
    if (!this.ctx || gain <= 0.01) return;
    const c = this.ctx, t = c.currentTime, f = 261.63 * Math.pow(2, n / 12);
    const out = c.createGain(); out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(0.32 * gain, t + 0.008);
    out.gain.exponentialRampToValueAtTime(0.0001, t + 1.6); out.connect(this.master);
    for (const [mul, amp, type] of [[1, 1, 'triangle'], [2, .35, 'sine'], [3, .12, 'sine'], [1.003, .4, 'sine']]) {
      const o = c.createOscillator(), gg = c.createGain(); o.type = type; o.frequency.value = f * mul; gg.gain.value = amp;
      o.connect(gg); gg.connect(out); o.start(t); o.stop(t + 1.7);
    }
  },
  // 다른 사람이 친 음: 내가 로비에 있을 때만, 피아노와 거리에 따라 작게
  playRemote(n) {
    if (S.big || L.zoneAt(PL.x, PL.z) !== 'lobby') return;
    const sp = L.spots.piano, d = Math.hypot(PL.x - sp.x, PL.z - sp.z);
    this.play(n, Math.pow(clamp(1 - d / 15, 0, 1), 1.4));
  },
};

  renderNet() {
    const banner = $('#netBanner'), chip = $('#btnInvite');
    const remote = SERVER_MODE || ROOM_PARAM;
    banner.hidden = !remote || !S.entered || net.status === 'open' || !net.err; banner.textContent = net.err;
    if (!SERVER_MODE && ROOM_PARAM) { chip.hidden = true; return; } // 초대받은 손님
    chip.hidden = !S.entered;
    if (SERVER_MODE) {
      chip.className = 'chip ' + (net.status === 'open' ? 'open' : 'connecting'); $('#inviteCount').textContent = '';
      if (UI.modalKind === 'invite') UI.openInvite(true);
      return;
    }
    const hub = net.hub, st = hub ? hub.status : 'other';
    chip.className = 'chip ' + (st === 'other' ? 'open' : st);
    $('#inviteCount').textContent = hub?.guests ? ` ${hub.guests}` : '';
