  openInvite(refresh) {
    if (SERVER_MODE) return UI.openServerInvite(refresh);
    const hub = net.hub, code = hub?.code || myRoomCode(), link = inviteLink(code);
    const httpsOk = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
    const st = !net.isServer ? 'open' : hub?.status || 'connecting';
    const stText = !net.isServer ? '이 기기의 다른 탭에서 방을 열고 있어요. 그 탭을 켜 두세요'
      : st === 'open' ? `방이 열려 있어요. 다른 기기에서 들어온 사람 ${hub.guests}명`
      : st === 'error' ? hub.err : (hub?.err || '방을 여는 중이에요…');
    const html = `<h2>친구 초대</h2>
      <p class="lead">이 링크를 받은 사람은 다른 폰이나 PC에서도 이 방에 들어와요. 링크는 매번 같고, 이 화면을 켜 둔 동안만 방이 열려 있어요.</p>
      <div class="invite"><input id="invLink" readonly value="${esc(link)}"><button class="primary" id="invCopy">복사</button>${navigator.share ? '<button class="ghost" id="invShare" style="height:38px">공유</button>' : ''}</div>
      <div class="netstat ${st}"><i></i><span>${esc(stText)}</span></div>
      ${httpsOk ? '' : '<div class="warnbox">지금 연 주소로는 다른 기기가 들어올 수 없어요. GitHub Pages처럼 https로 시작하는 인터넷 주소에 올려서 열어 주세요.</div>'}
      <div class="setrow"><div>화면 꺼짐 막기<small>폰 화면이 꺼지거나 다른 앱으로 가면 방이 닫혀요</small></div><button class="toggle ${S.wantWake ? 'on' : ''}" id="invWake" aria-label="화면 꺼짐 막기"></button></div>`;
    const mount = sh => {
      sh.querySelector('#invCopy').onclick = async () => {
        const inp = sh.querySelector('#invLink');
        try { await navigator.clipboard.writeText(link); } catch { inp.select(); try { document.execCommand('copy'); } catch {} }
        UI.toast('초대 링크를 복사했어요');
      };
      const shr = sh.querySelector('#invShare'); if (shr) shr.onclick = () => navigator.share({ title: CONFIG.ROOM_NAME, text: '같이 영화 보러 와', url: link }).catch(() => {});
      sh.querySelector('#invWake').onclick = e => { S.wantWake = !S.wantWake; e.target.classList.toggle('on', S.wantWake); keepAwake(S.wantWake); };
    };
    if (refresh) { const sheet = $('#modal .sheet'); sheet.innerHTML = `<button class="x" data-close aria-label="닫기">✕</button>` + html; mount(sheet); }
    else UI.open('invite', html, mount);
  },
  openServerInvite(refresh) {
    const link = location.origin + location.pathname, st = net.status === 'open' ? 'open' : 'connecting';
    const html = `<h2>친구 초대</h2>
      <p class="lead">이 주소로 들어오는 사람은 모두 같은 방이에요. 서버가 계속 켜져 있어서 방장이 없어도 방이 열려 있어요. 15분 동안 아무도 없으면 서버가 잠들고, 다음 사람이 들어올 때 1분쯤 걸려 깨어나요.</p>
      <div class="invite"><input id="invLink" readonly value="${esc(link)}"><button class="primary" id="invCopy">복사</button>${navigator.share ? '<button class="ghost" id="invShare" style="height:38px">공유</button>' : ''}</div>

    const mount = sh => {
      sh.querySelector('#invCopy').onclick = async () => {

  },

// ============================================================
//  주먹다짐 (화면 쪽) — F 주먹, G 발차기 / 잠근 마우스면 왼쪽·오른쪽 버튼
//  판정은 서버가 하고, 여기서는 동작·효과음·밀려남·쓰러짐 화면만 보여 줌
// ============================================================
// ---------- 1인칭 팔·다리 ----------
// 공격하는 동안에만 카메라 앞에 따로 그려 줌 → 소매 낀 팔이 화면 아래에서 조준점 쪽으로 뻗었다 돌아옴
// (좌표는 카메라 기준: 오른쪽 +x, 위 +y, 앞 -z)
const VM = {
  scene: null, cam: null, anim: null, side: -1,
  build() {
    const sc = this.scene = new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xfff1dc, 0x1a1c3a, 2.2));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(0.5, 1, 0.8); sc.add(sun);
    this.cam = new THREE.PerspectiveCamera(70, 1, 0.01, 10);
    this.sleeve = new THREE.MeshLambertMaterial(); this.skin = new THREE.MeshLambertMaterial(); this.pants = new THREE.MeshLambertMaterial();
    this.shoeMat = new THREE.MeshLambertMaterial({ color: 0x3a4180 }); this.soleMat = new THREE.MeshLambertMaterial({ color: 0xf4efe2 });
    this.laceMat = new THREE.MeshLambertMaterial({ color: 0xf4efe2 });
    // 팔다리: 원점에서 +z로 길이 1 → lookAt으로 방향, scale.z로 길이를 맞춤

  // 입장할 때 미리 만들고 그래픽 카드에 올려 둠 → 첫 주먹에서 멈칫하지 않게
  prepare(r) {
    try { if (!this.scene) this.build(); this.paint(); r.compile(this.scene, this.cam); } catch {}
  },
  paint() {
    const col = S.myPub?.color || S.profile.color || '#7FB2FF';
    this.sleeve.color.set(col); this.skin.color.copy(shade(col, .18)); this.pants.color.copy(shade(col, -.14));
  },
  start(kind) {

  },
  render(r, mainCam) {

    const now = performance.now();
    if (a.last != null) a.el += Math.min(50, now - a.last);
    a.last = now;
    const p = a.el / a.dur;
    if (p >= 1 || S.big || S.dead || S.seated) { this.anim = null; return; }
    const c = this.cam;
    if (c.fov !== mainCam.fov || c.aspect !== mainCam.aspect) { c.fov = mainCam.fov; c.aspect = mainCam.aspect; c.updateProjectionMatrix(); }

  // 팔다리 하나를 a에서 b까지 잇기 (끝에서 gap만큼 짧게)

      } else {

  onRespawn(m) {

  near(id) { const a = avatars.get(id); return a && a.g.position.distanceTo(W.camera.position) < 12; },
  // 밀려남·화면 흔들림·쓰러짐 카운트다운

function sendHello(silent) {
  S.helloed = true;
  net.send({ t: 'hello', sessionId: S.sid, name: S.profile.name, color: S.profile.color, wear: S.myPub?.wear, hold: S.myPub?.hold, admin: S.adminPw, owner: myOwnerKey(), silent });

// 숨은 방장 열쇠: 이 기기에만 저장 (다른 사람에게는 보내지 않음)

  switch (m.t) {
    case 'welcome':
      S.me = m.you; S.board = m.board || [];
      if (!S.chat.length || m.chat?.length) { S.chat = []; for (const c of m.chat || []) S.chat.push(c); UI.renderChat(); }
      W.boardTex.redraw(S.board);

      if (S.onWelcome) { const f = S.onWelcome; S.onWelcome = null; f(); }

    case 'room': clock.off = m.serverNow - Date.now(); S.room = m; onRoom(); break;
    case 'pos':
      for (const [id, x, y, z, ry] of m.l) if (id !== S.me) avatars.get(id)?.setTarget(x, y, z, ry);
      break;

      UI.toast(m.text, m.err);

function onRoom() {
  const r = S.room;
  S.myPub = r.users.find(u => u.id === S.me) || null;
  S.isHost = r.hostId === S.me; S.isAdmin = !!S.myPub?.admin; S.isOwner = !!r.ownerId && r.ownerId === S.me;
  if (S.myPub) { S.myHp = S.myPub.hp; if (S.myPub.dead && !S.dead) Fight.onFx({ k: 'down', id: S.me }); }
  Fight.renderHp();
  if (UI.modalKind === 'settings' && (S._wasAdmin !== S.isAdmin || S._wasHost !== S.isHost)) setTimeout(() => UI.openSettings());
  S._wasAdmin = S.isAdmin; S._wasHost = S.isHost;
  // 서버 기준 좌석과 내 화면이 어긋나면 서버를 따름
  if (S.myPub && S.seated && S.myPub.seat !== S.seated && !S._sitPending) {

}

const canvas = document.getElementById('gl');
function exitLock() { if (document.pointerLockElement) document.exitPointerLock?.(); }
function look(dx, dy, k = 1) {
  const s = 0.0011 * S.sens * 0.4 * k;
  PL.yaw -= dx * s; PL.pitch = clamp(PL.pitch - dy * s, -1.45, 1.45);
}
canvas.addEventListener('click', () => {
  if (!S.entered || IS_TOUCH || S.big || UI.modalKind || S.noLock) return;
  try { const p = canvas.requestPointerLock?.(); p?.catch?.(() => onLockFail()); } catch { onLockFail(); }
});
function onLockFail() { if (!S.noLock) { S.noLock = true; UI.toast('이 브라우저에선 마우스 잠금이 안 돼요. 화면을 끌어서 둘러보세요'); } }
document.addEventListener('pointerlockerror', onLockFail);
document.addEventListener('pointerlockchange', () => UI.renderHints());
let drag = null;
canvas.addEventListener('mousedown', e => {
  if (document.pointerLockElement === canvas) { if (e.button === 0) Fight.attack('punch'); else if (e.button === 2) Fight.attack('kick'); return; }
  if (e.button === 0) drag = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mouseup', () => { drag = null; });
addEventListener('mousemove', e => {
  if (!S.entered) return;
  if (document.pointerLockElement === canvas) { look(e.movementX, e.movementY); markActive(); }
  else if (drag && !UI.modalKind) { look(e.clientX - drag.x, e.clientY - drag.y, 2.2); drag = { x: e.clientX, y: e.clientY }; markActive(); }
});

// ---------- 터치: 왼쪽 조이스틱, 나머지 화면 끌어서 둘러보기 ----------
const stick = $('#stick'), knob = $('#knob');
function joyMove(t) {
  const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = r.width / 2;
  let dx = t.clientX - cx, dy = t.clientY - cy; const d = Math.hypot(dx, dy); if (d > R) { dx *= R / d; dy *= R / d; }
  joy.x = dx / R; joy.y = dy / R; knob.style.transform = `translate(${dx}px,${dy}px)`;
}
stick.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; joy.id = t.identifier; joyMove(t); markActive(); }, { passive: false });
stick.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === joy.id) joyMove(t); markActive(); }, { passive: false });
const joyEnd = e => { for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; } };
stick.addEventListener('touchend', joyEnd); stick.addEventListener('touchcancel', joyEnd);
const lookTouches = new Map();
canvas.addEventListener('touchstart', e => { for (const t of e.changedTouches) lookTouches.set(t.identifier, { x: t.clientX, y: t.clientY }); markActive(); }, { passive: true });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) { const p = lookTouches.get(t.identifier); if (!p) continue; look(t.clientX - p.x, t.clientY - p.y, 2.6); p.x = t.clientX; p.y = t.clientY; }
  markActive();
}, { passive: false });
const lookEnd = e => { for (const t of e.changedTouches) lookTouches.delete(t.identifier); };
canvas.addEventListener('touchend', lookEnd); canvas.addEventListener('touchcancel', lookEnd);

// ---------- 키보드 ----------
const typing = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); };
addEventListener('keydown', e => {
  if (!S.entered) return;
  markActive();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (e.key === 'Escape') {
    if (typing()) { document.activeElement.blur(); document.body.classList.remove('chatting'); return; }
    if (UI.modalKind) return UI.close();
    if (S.big) return setBig(false);
    $('#queuePanel').hidden = true; $('#usersPanel').hidden = true; UI.showBag(false); return;
  }
  if (typing()) return;
  if (UI.modalKind === 'piano' && !e.repeat && UI.pianoKey(k)) { e.preventDefault(); return; }
  if (UI.modalKind) return;
  if (e.key === 'Enter') { e.preventDefault(); exitLock(); $('#chatInput').focus(); return; }
  if (e.repeat) { keys.add(e.code); return; }
  keys.add(e.code);
  if (e.code === 'KeyE') interact();
  else if (e.code === 'KeyF') Fight.attack('punch');
  else if (e.code === 'KeyG') Fight.attack('kick');
  else if (e.code === 'KeyV') setBig(!S.big);
  else if (e.code === 'KeyQ') togglePanel('#queuePanel');
  else if (e.code === 'KeyB') UI.showBag($('#bagSlots').hidden);
  else if (e.code === 'Space' && S.seated) { e.preventDefault(); interact(); }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
addEventListener('wheel', markActive, { passive: true });

function togglePanel(sel) {
  const p = $(sel), open = p.hidden; p.hidden = !open;
  if (open) { if (sel === '#queuePanel') UI.renderQueue(); else UI.renderUsers(); }
}
function setBig(on) {
  S.big = on; document.body.classList.toggle('big', on); $('#exitBig').hidden = !on;
  if (on) exitLock();
  UI.renderHand(); UI.setPrompt(S.inter);
}

// ---------- 상호작용 (E) ----------
function findInteraction() {
  if (S.dead) return null;
  if (S.seated) return { type: 'stand', label: `일어나기 (${S.seated})`, short: '일어나기' };
  const zone = L.zoneAt(PL.x, PL.z);
  if (zone === 'lobby') {
    let best = null, bd = 1e9;
    for (const [type, sp] of Object.entries(L.spots)) { const d = Math.hypot(PL.x - sp.x, PL.z - sp.z); if (d < sp.r && d < bd) { best = { type, label: sp.label, short: { snack: '매점', goods: '굿즈', vending: '뽑기', piano: '피아노', board: '게시판' }[type] }; bd = d; } }
    return best;
  }
  if (zone === 'theater') {
    let best = null, bd = 1.25;
    for (const s of L.seats) {
      if (Math.abs(PL.y - s.y) > 0.6) continue;
      const d = Math.hypot(PL.x - s.stand.x, PL.z - s.stand.z); if (d < bd) { bd = d; best = s; }
    }
    if (!best) return null;
    const who = S.room?.users.find(u => u.seat === best.id);
    if (who) return { type: null, label: `${best.id} 좌석, ${who.name} 님 자리예요` };
    return { type: 'sit', seat: best, label: `${best.id} 좌석에 앉기`, short: '앉기' };
  }
  return null;
}
function interact() {
  const it = S.inter; if (!it?.type || S.big) return;
  Piano.init();
  switch (it.type) {
    case 'sit': S._sitPending = true; net.send({ t: 'sit', seatId: it.seat.id }); setTimeout(() => { S._sitPending = false; }, 600); break;
    case 'stand': net.send({ t: 'stand' }); break;
    case 'snack': UI.openSnack(); break;
    case 'goods': UI.openGoods(); break;
    case 'vending': UI.openVending(); break;
    case 'piano': UI.openPiano(); break;
    case 'board': UI.openBoard(); break;
  }
}

// ---------- 이동 ----------
function updatePlayer(dt, t) {
  let fx = 0, fz = 0;
  const free = !S.big && !S.seated && !UI.modalKind && !typing() && !S.dead;
  if (free) {
    if (keys.has('KeyW') || keys.has('ArrowUp')) fz -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) fz += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) fx -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) fx += 1;
    fx += joy.x; fz += joy.y;
  }
  const len = Math.hypot(fx, fz);
  if (len > 0.05) {
    if (len > 1) { fx /= len; fz /= len; }
    const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight') || Math.hypot(joy.x, joy.y) > 0.95) ? 5.4 : 3.2;
    const c = Math.cos(PL.yaw), s = Math.sin(PL.yaw);
    const dx = (fx * c + fz * s) * sp * dt, dz = (-fx * s + fz * c) * sp * dt;
    const step = (nx, nz) => L.walkable(nx, nz) && L.floorAt(nx, nz) - PL.y < 0.65;
    if (step(PL.x + dx, PL.z)) PL.x += dx;
    if (step(PL.x, PL.z + dz)) PL.z += dz;
    PL.moving = Math.min(1, PL.moving + dt * 6);
  } else PL.moving = Math.max(0, PL.moving - dt * 6);
  const cam = W.camera;
  if (S.big) {
    const tf = Math.tan(cam.fov * Math.PI / 360);
    const dist = Math.max((L.SCR_H / 2) / tf, (L.SCR_W / 2) / (tf * cam.aspect)) * 1.03;
    cam.position.set(0, W.screen.centerY, L.SCREEN_Z + dist); cam.rotation.set(0, 0, 0);
    return;
  }
  if (S.seated) {
    const s = L.seatById[S.seated];
    cam.position.set(s.eye.x, s.eye.y, s.eye.z);
  } else {
    Fight.update(dt);
    PL.y += (L.floorAt(PL.x, PL.z) - PL.y) * Math.min(1, dt * 12);
    const bob = Math.sin(t * 10) * 0.035 * PL.moving;
    // 쓰러지면 바닥에 누운 시점
    cam.position.set(PL.x, PL.y + (S.dead ? 0.35 : L.EYE_STAND + bob), PL.z);
    Fight.shake(cam);
  }
  cam.rotation.set(S.dead ? 0.35 : PL.pitch, PL.yaw, S.dead ? 0.55 : 0);
}
function attract(t) {
  const cam = W.camera;
  cam.position.set(Math.sin(t * 0.06) * 2.8, L.TOP_Y + 1.7, L.BACK_Z - 2.4);
  cam.lookAt(0, W.screen.centerY + 1.2 + Math.sin(t * 0.05) * 1.4, L.SCREEN_Z);
}

// ---------- 주기 작업 ----------
let lastSent = { x: 0, y: 0, z: 0, yaw: 0, at: 0 };
setInterval(() => {
  if (!S.entered) return;
  if (S.seated) {
    if (Math.abs(PL.yaw - lastSent.yaw) > 0.05 && performance.now() - lastSent.at > 240) { lastSent.yaw = PL.yaw; lastSent.at = performance.now(); net.send({ t: 'look', ry: +PL.yaw.toFixed(2) }); }
  } else if (Math.abs(PL.x - lastSent.x) + Math.abs(PL.z - lastSent.z) + Math.abs(PL.y - lastSent.y) > 0.02 || Math.abs(PL.yaw - lastSent.yaw) > 0.03) {
    lastSent = { x: PL.x, y: PL.y, z: PL.z, yaw: PL.yaw, at: performance.now() };
    net.send({ t: 'move', p: [+PL.x.toFixed(3), +PL.y.toFixed(3), +PL.z.toFixed(3)], ry: +PL.yaw.toFixed(3) });
  }
  const inter = findInteraction();
  if (JSON.stringify([inter?.type, inter?.label]) !== JSON.stringify([S.inter?.type, S.inter?.label]) || !!S.big !== !!S._bigPrompt) { S.inter = inter; S._bigPrompt = S.big; UI.setPrompt(inter); }
  else S.inter = inter;
}, 100);
setInterval(() => {
  if (!S.entered) return;
  const z = L.zoneAt(PL.x, PL.z);
  Video.setFactor(S.big ? 1 : z === 'theater' ? 1 : z === 'corridor' ? 0.3 : 0);
  Video.sync(); UI.tick(); Fight.renderHp();
  if (S.myPub?.eating && S.myPub.eating.until < clock.now()) UI.renderHand();
}, 500);
setInterval(() => { if (S.entered) net.send({ t: 'ping' }); }, 4000);
addEventListener('pagehide', () => { if (S.entered) net.send({ t: 'bye' }); });

// ---------- HUD 버튼 ----------
function bindHud() {
  $('#btnUsers').onclick = () => togglePanel('#usersPanel');
  $('#btnSettings').onclick = () => UI.openSettings();
  $('#btnInvite').onclick = () => UI.openInvite();
  $('#btnQueue').onclick = () => togglePanel('#queuePanel');
  $('#mQueue').onclick = () => togglePanel('#queuePanel');
  $('#btnBig').onclick = () => setBig(!S.big);
  $('#mBig').onclick = () => setBig(!S.big);
  $('#exitBig').onclick = () => setBig(false);
  $('#mE').onclick = () => interact();
  $('#mPunch').addEventListener('pointerdown', e => { e.preventDefault(); Fight.attack('punch'); });
  $('#mKick').addEventListener('pointerdown', e => { e.preventDefault(); Fight.attack('kick'); });
  $('#soundBtn').onclick = () => Video.unmute();
  $('#mChat').onclick = () => {
    const on = !document.body.classList.contains('chatting'); document.body.classList.toggle('chatting', on);
    if (on) $('#chatInput').focus(); else $('#chatInput').blur();
  };
  $('#chatFilters').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.filter = b.dataset.f; UI.renderChat(); };
  // 폼 제출 대신 버튼·Enter로 처리 (미리보기처럼 폼 제출이 막힌 창에서도 동작하게)
  onEnter($('#chatInput'), () => {
    const v = $('#chatInput').value.trim();
    const oc = v.match(/^\/(방장|host)(?:\s+(.*))?$/i); // 방장 명령은 채팅이 아니라 따로 보냄 → 아무에게도 안 보임
    if (oc) net.send({ t: 'owner', key: (oc[2] || '').trim() });
    else if (v) net.send({ t: 'chat', text: v });
    $('#chatInput').value = ''; $('#chatInput').blur(); document.body.classList.remove('chatting'); markActive();
  });
  const reserve = async () => {
    const raw = $('#urlInput').value; const vid = parseYouTubeId(raw);
    if (!vid) return UI.toast('유튜브 주소를 알아보지 못했어요. youtube.com/watch?v= 나 youtu.be/ 주소를 넣어 주세요', true);
    const priority = !!(S.isHost && $('#prioCheck').checked);
    net.send({ t: 'queueAdd', videoId: vid, start: startAtFromUrl(raw), priority });
    $('#urlInput').value = ''; $('#prioCheck').checked = false; $('#urlInput').blur(); markActive();
    const title = await fetchTitle(vid); if (title) net.send({ t: 'titleFor', videoId: vid, title });
  };
  $('#urlBtn').onclick = reserve; onEnter($('#urlInput'), reserve);
  $('#voteCard').onclick = e => { const b = e.target.closest('[data-vote]'); if (b && S.room?.vote) { net.send({ t: 'vote', voteId: S.room.vote.id, choice: b.dataset.vote }); markActive(); } };
  $('#queuePanel').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return; markActive();
    if (b.dataset.fight) return net.send({ t: 'voteStart', type: 'fight', itemId: b.dataset.fight });
    if (b.dataset.del) return net.send({ t: 'queueRemove', itemId: b.dataset.del });
    const a = b.dataset.act;
    if (a === 'skipvote') net.send({ t: 'voteStart', type: 'skip' });
    else if (a === 'big') setBig(true);
    else if (a === 'cleanup') net.send({ t: 'cleanupLeft' });
    else if (a === 'bots') net.send({ t: 'bots', on: !S.room?.botsOn });
    else if (a === 'adminskip') { if (await UI.confirm(`"${itemLabel(S.room?.now?.item)}"을(를) 지금 바로 넘길까요? 투표 없이 다음 영상으로 넘어가요.`, '넘기기')) net.send({ t: 'adminSkip' }); }
  };
  $('#btnBag').onclick = () => UI.showBag($('#bagSlots').hidden);
  $('#bag').addEventListener('click', e => {
    UI.bumpBag();
    const slot = e.target.closest('[data-slot]'), tray = e.target.closest('[data-tray]'), sa = e.target.closest('[data-sa]');
    if (sa) {
      const k = sa.dataset.k, a = sa.dataset.sa;
      if (a === 'use') net.send({ t: 'use', key: k }); else if (a === 'tray') net.send({ t: 'trayPut', key: k }); else if (a === 'discard') net.send({ t: 'discard', key: k });
      document.querySelector('.slotmenu')?.remove(); UI.slotSel = null; markActive(); return;
    }
    if (tray) { net.send({ t: 'trayTake', i: +tray.dataset.tray }); return; }
    if (slot) { const k = slot.dataset.slot; if (UI.slotSel === k) { UI.slotSel = null; document.querySelector('.slotmenu')?.remove(); } else { UI.slotSel = k; UI.openSlotMenu(k); } UI.renderBag(); }
  });
  $('#modal').addEventListener('click', e => {
    if (e.target.id === 'modal' || e.target.closest('[data-close]')) return UI.close();
    const b = e.target.closest('button'); if (!b) return; markActive();
    if (b.dataset.buy) net.send({ t: 'buy', shop: b.dataset.shop, id: b.dataset.buy });
    else if (b.dataset.reply) { const inp = document.querySelector(`[data-rin="${b.dataset.reply}"]`); if (inp?.value.trim()) net.send({ t: 'boardReply', postId: b.dataset.reply, text: inp.value }); }
    else if (b.dataset.pdel) net.send({ t: 'boardDelete', postId: b.dataset.pdel });
  });
  ['pointerdown', 'touchstart'].forEach(ev => $('#hud').addEventListener(ev, markActive, { passive: true }));
  UI.renderHints();
}

// ---------- 입장권 ----------
function setupEntry() {
  document.title = CONFIG.ROOM_NAME; document.querySelector('.admit h1').textContent = CONFIG.ROOM_NAME;
  if (!S.profile.color || !AVATAR_COLORS.includes(S.profile.color)) S.profile.color = AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)];
  $('#nameInput').value = S.profile.name || '';
  const sw = $('#swatches');
  const paint = () => { sw.innerHTML = AVATAR_COLORS.map(c => `<button type="button" data-c="${c}" class="${c === S.profile.color ? 'on' : ''}" style="background:${c}" aria-label="색 ${c}"></button>`).join(''); };
  paint(); sw.onclick = e => { const b = e.target.closest('[data-c]'); if (b) { S.profile.color = b.dataset.c; paint(); } };
  $('#ticketNo').textContent = String(Math.floor(Math.random() * 9000) + 1000);
  const d = new Date(); $('#ticketDate').textContent = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${'일월화수목금토'[d.getDay()]}`;
  let framed = false; try { framed = window.self !== window.top; } catch { framed = true; }
  $('#fileWarn').hidden = /^https?:$/.test(location.protocol) && !framed;
  if (ROOM_PARAM && !SERVER_MODE) {
    document.querySelector('.tear .seat').textContent = '초대석';
    $('#ticketNo').textContent = ROOM_PARAM;
    document.querySelector('.admit .sub').textContent = '초대받은 방에 들어가요';
  }
  const enter = () => {
    if (S.entered || S.joining || $('#enterBtn').disabled) return;
    const name = $('#nameInput').value.trim() || `관객${Math.floor(1000 + Math.random() * 9000)}`;
    S.profile.name = name; saveProfile();
    // 하나가 실패해도 입장은 되게 따로따로 시작
    for (const [label, fn] of [['소리', () => Piano.init()], ['유튜브', () => { Video.init(); Video.setVolume(S.vol); }]]) {
      try { fn(); } catch (err) { console.warn(label + ' 준비 실패', err); }
    }
    if (JOIN_FIRST) { // 손님·서버 모드: 연결된 뒤에 입장
      S.joining = true; S.onWelcome = finishEnter;
      const b = $('#enterBtn'); b.disabled = true; b.textContent = SERVER_MODE ? '서버에 연결하는 중…' : '방에 연결하는 중…';
      net.start();
      return;
    }
    try { net.start(); } catch (err) { console.warn('연결 준비 실패', err); }
    S.wantWake = true; keepAwake(true);
    finishEnter();
  };
  function finishEnter() {
    if (S.entered) return;
    $('#bootMsg').hidden = true;
    $('#entry').classList.add('go');
    setTimeout(() => $('#entry').remove(), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 650);
    $('#hud').hidden = false; document.body.classList.add('playing'); if (IS_TOUCH) document.body.classList.add('touch');
    PL.x = L.SPAWN.x; PL.z = L.SPAWN.z; PL.y = L.TOP_Y; PL.yaw = L.SPAWN.yaw; PL.pitch = 0.05;
    S.entered = true; S.joining = false; lastAct = 0; markActive();
    UI.renderNet();
  }
  $('#enterBtn').onclick = enter; onEnter($('#nameInput'), enter);
  if (!IS_TOUCH) setTimeout(() => $('#nameInput').focus(), 300);
}
function onEnter(input, fn) {
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return; // 한글 조합 중 Enter는 무시
    e.preventDefault(); e.stopPropagation(); fn();
  });
}

// ---------- 시작 ----------
try {
  buildWorld();
} catch (err) {
  console.error(err);
  window.__bootFail?.('이 화면에서는 3D 그래픽(WebGL)을 쓸 수 없어요. 크롬이나 사파리로 직접 열어 주세요.');
  throw err;
}
if (IS_TOUCH) document.body.classList.add('touch');
applyGfx();
setScreenMode(false, '');
bindHud(); setupEntry(); UI.setPrompt(null);
VM.prepare(W.renderer);
window.__cinemaReady = true;
$('#enterBtn').disabled = false; $('#enterBtn').textContent = '입장하기';
Promise.all([document.fonts.load(`400 40px "Black Han Sans"`), document.fonts.load(`700 20px "Pretendard Variable"`)].map(p => p.catch(() => {})))
  .then(() => document.fonts.ready).then(() => redrawables.forEach(t => t.redraw()));
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; const t = now / 1000;
  if (S.entered) updatePlayer(dt, t); else attract(t);
  for (const a of avatars.values()) a.update(dt, t);
  updatePopups();
  animateWorld(t);
  W.renderer.render(W.scene, W.camera);
  VM.render(W.renderer, W.camera);
  W.css.render(W.cssScene, W.camera);
}
requestAnimationFrame(frame);
window.__cinema = { S, L, W, PL, net, Video, UI, avatars, VM, Fight };

</script>
